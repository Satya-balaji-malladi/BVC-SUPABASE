<script>
  /**
   * ==========================================
   * SYSTEM SETTINGS CONTROLLER
   * ==========================================
   */
  App.Modules.settings = {
    settingsData: {},
    auditLogs: [],
    filteredAudits: [],
    
    // Pagination for Audits
    currentAuditPage: 1,
    auditsPerPage: 15,

    init: function() {
      console.log('Settings module init');
      this.bindEvents();
      this.loadSettings();
      this.enforceRoleVisibility();
      this.loadDepartments();
    },

    bindEvents: function() {
      // General Settings form
      const genForm = document.getElementById('generalSettingsForm');
      if (genForm) {
        genForm.addEventListener('submit', (e) => {
          e.preventDefault();
          this.saveGeneralSettings();
        });
      }

      // Rules form
      const rulesForm = document.getElementById('attendanceRulesForm');
      if (rulesForm) {
        rulesForm.addEventListener('submit', (e) => {
          e.preventDefault();
          this.saveRulesSettings();
        });
      }

      // Department structure form submit
      const deptForm = document.getElementById('departmentStructureForm');
      if (deptForm) {
        deptForm.addEventListener('submit', (e) => {
          e.preventDefault();
          this.saveDepartmentStructure();
        });
      }

      // Action triggers for maintenance
      document.getElementById('btnWipeAttendance')?.addEventListener('click', () => this.handleWipeAttendance());
      document.getElementById('btnResetAll')?.addEventListener('click', () => this.handleResetSystem());
      document.getElementById('btnBackupExcel')?.addEventListener('click', () => this.exportBackupData());

      // Audit logs search
      document.getElementById('auditSearchInput')?.addEventListener('input', (e) => {
        this.filterAuditLogs(e.target.value);
      });

      // Export audit trails
      document.getElementById('auditExportBtn')?.addEventListener('click', () => this.exportAuditCSV());

      // Handle audit tab click to load logs dynamically
      const auditTab = document.getElementById('audit-tab');
      if (auditTab) {
        auditTab.addEventListener('shown.bs.tab', () => {
          this.loadAuditLogs();
        });
      }

      // Departments tab click
      const deptsTab = document.getElementById('departments-tab');
      if (deptsTab) {
        deptsTab.addEventListener('shown.bs.tab', () => {
          this.loadDepartments();
        });
      }

      // Add Department button
      document.getElementById('btnAddDepartment')?.addEventListener('click', () => {
        this.openDeptModal('add');
      });

      // Department form submit & button click handlers with trace markers
      const addDeptForm = document.getElementById('departmentForm');
      if (addDeptForm) {
        addDeptForm.addEventListener('submit', (e) => {
          e.preventDefault();
          console.log("[DEPT-04] submit handler entered");
          this.saveDepartment();
        });
      }

      // Diagnostic runner button
      document.getElementById('btnRunDeptDiagnostic')?.addEventListener('click', () => {
        App.LoadingManager.show();
        App.API.runDiagnosticTest().then(res => {
          App.LoadingManager.hide();
          const logText = (res && res.data && res.data.log) ? res.data.log : (res ? JSON.stringify(res) : "No log output");
          alert(logText);
          this.loadDepartments();
        }).catch(err => {
          App.LoadingManager.hide();
          alert("❌ Diagnostic Runner Error:\n" + (err.message || err));
        });
      });

      document.getElementById('btnSaveDept')?.addEventListener('click', (e) => {
        console.log("[DEPT-03] btnSaveDept clicked directly");
        const form = document.getElementById('departmentForm');
        if (form && form.checkValidity()) {
          e.preventDefault();
          this.saveDepartment();
        } else if (form) {
          form.classList.add('was-validated');
          console.warn("[DEPT-03a] Form HTML validation failed on click");
        }
      });

      // Table row actions (Edit/Delete)
      const deptsTableBody = document.getElementById('departmentsTableBody');
      if (deptsTableBody) {
        deptsTableBody.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');
          const id = btn.getAttribute('data-id');
          if (action === 'edit-dept') this.openDeptModal('edit', id);
          if (action === 'delete-dept') this.deleteDepartment(id);
        });
      }
    },

    enforceRoleVisibility: function() {
      const user = (App.State && App.State.currentUser) || App.Auth.currentUser || {};
      const rawRole = String(user.role || user.Role || localStorage.getItem('userRole') || 'Coordinator').toUpperCase().trim();
      const isSuperAdmin = (rawRole === 'SUPER ADMIN' || rawRole === 'SUPER_ADMIN' || rawRole === 'ADMIN');
      const isHOD = (rawRole === 'HOD');

      const hodContainer = document.getElementById('hod-structure-container');
      const superadminContainer = document.getElementById('superadmin-depts-container');

      if (isSuperAdmin) {
        document.getElementById('tab-maintenance-wrapper')?.classList.remove('d-none');
        document.getElementById('tab-audit-wrapper')?.classList.remove('d-none');
        if (hodContainer) hodContainer.classList.add('d-none');
        if (superadminContainer) superadminContainer.classList.remove('d-none');
      } else {
        document.getElementById('tab-maintenance-wrapper')?.classList.add('d-none');
        document.getElementById('tab-audit-wrapper')?.classList.add('d-none');
        if (hodContainer) hodContainer.classList.remove('d-none');
        if (superadminContainer) superadminContainer.classList.add('d-none');
      }
    },

    loadSettings: function() {
      App.LoadingManager.show();
      App.API._call('getSettings')
        .then(res => {
          App.LoadingManager.hide();
          const d = res.data || {};
          this.settingsData = d;

          // Populate inputs
          if (document.getElementById('setCollegeName')) document.getElementById('setCollegeName').value = d.collegeName || 'BVC Engineering College';
          if (document.getElementById('setAdminEmail')) document.getElementById('setAdminEmail').value = d.adminEmail || '';
          if (document.getElementById('setPagination')) document.getElementById('setPagination').value = d.pagination || '10';
          if (document.getElementById('setTheme')) document.getElementById('setTheme').value = d.theme || 'light';
          if (document.getElementById('setLanguage')) document.getElementById('setLanguage').value = d.language || 'en';
          
          if (document.getElementById('setNotificationsEnabled')) {
            document.getElementById('setNotificationsEnabled').checked = d.notificationsEnabled !== false;
          }

          if (document.getElementById('setAttendanceThreshold')) {
            document.getElementById('setAttendanceThreshold').value = d.attendanceThreshold || '75';
          }

          if (document.getElementById('setAcademicYears')) {
            document.getElementById('setAcademicYears').value = d.academicYears || '2024-25, 2025-26';
          }

          // Populate HOD Department & Academic Structure fields
          const currentUser = App.State && App.State.currentUser;
          const userDept = currentUser ? (currentUser.department || currentUser.Department) : (localStorage.getItem('userDept') || 'CSE');
          if (document.getElementById('hodDeptName')) document.getElementById('hodDeptName').value = d.hodDeptName || `${userDept} Department`;
          if (document.getElementById('hodDeptCode')) document.getElementById('hodDeptCode').value = d.hodDeptCode || userDept;
          if (document.getElementById('hodDeptEmail')) document.getElementById('hodDeptEmail').value = d.hodDeptEmail || `hod.${String(userDept).toLowerCase()}@bvcgroup.in`;
          if (document.getElementById('hodDeptBranches')) document.getElementById('hodDeptBranches').value = d.hodDeptBranches || `${userDept}, ${userDept}-AIML, ${userDept}-DS`;
          if (document.getElementById('hodDeptYears')) document.getElementById('hodDeptYears').value = '2, 3, 4';
          if (document.getElementById('hodDeptSections')) document.getElementById('hodDeptSections').value = d.hodDeptSections || 'A, B, C';
        })
        .catch(err => {
          App.LoadingManager.hide();
          console.error("Failed to load settings data", err);
          App.UI.showError("Failed to fetch settings from server.");
        });
    },

    saveDepartmentStructure: function() {
      const payload = {
        hodDeptName: document.getElementById('hodDeptName')?.value || '',
        hodDeptCode: document.getElementById('hodDeptCode')?.value || '',
        hodDeptEmail: document.getElementById('hodDeptEmail')?.value || '',
        hodDeptBranches: document.getElementById('hodDeptBranches')?.value || '',
        hodDeptYears: '2, 3, 4',
        hodDeptSections: document.getElementById('hodDeptSections')?.value || ''
      };

      App.LoadingManager.show();
      App.API._call('saveSettings', payload)
        .then(() => {
          App.LoadingManager.hide();
          App.UI.showSuccess('Department & Academic Structure updated successfully!');
        })
        .catch(err => {
          App.LoadingManager.hide();
          App.UI.showError('Failed to save department structure: ' + err.message);
        });
    },

    saveGeneralSettings: function() {
      const form = document.getElementById('generalSettingsForm');
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const payload = {
        collegeName: document.getElementById('setCollegeName').value.trim(),
        adminEmail: document.getElementById('setAdminEmail').value.trim(),
        pagination: parseInt(document.getElementById('setPagination').value, 10),
        theme: document.getElementById('setTheme').value,
        language: document.getElementById('setLanguage').value,
        notificationsEnabled: document.getElementById('setNotificationsEnabled').checked
      };

      this.executeSave(payload);
    },

    saveRulesSettings: function() {
      const form = document.getElementById('attendanceRulesForm');
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const payload = {
        attendanceThreshold: parseInt(document.getElementById('setAttendanceThreshold').value, 10),
        academicYears: document.getElementById('setAcademicYears').value.trim()
      };

      this.executeSave(payload);
    },

    executeSave: function(payload) {
      App.LoadingManager.show();
      App.API._call('saveSettings', payload)
        .then(res => {
          App.LoadingManager.hide();
          if (res.success) {
            App.UI.showSuccess("Settings updated successfully!");
            this.loadSettings();
          } else {
            App.UI.showError(res.message || "Failed to update settings.");
          }
        })
        .catch(err => {
          App.LoadingManager.hide();
          console.error(err);
          App.UI.showError("Save operation crashed.");
        });
    },

    handleWipeAttendance: function() {
      if (confirm("WARNING: Are you sure you want to CLEAR all attendance check-in records? This action cannot be undone and will erase all scan logs!")) {
        App.LoadingManager.show();
        App.API._call('clearAttendanceLogs')
          .then(res => {
            App.LoadingManager.hide();
            if (res.success) {
              App.UI.showSuccess("All attendance check-in records have been wiped.");
            } else {
              App.UI.showError(res.message);
            }
          })
          .catch(err => {
            App.LoadingManager.hide();
            App.UI.showError("Clear logs failed.");
          });
      }
    },

    handleResetSystem: function() {
      if (confirm("CRITICAL WARNING: You are about to RESET the entire system! This will delete all attendance logs, participant lists, and scheduled events. Do you want to proceed?")) {
        if (confirm("DOUBLE CONFIRMATION REQUIRED: This will return the application to an empty state. Type 'OK' in the next window if you are absolutely certain.")) {
          const verify = prompt("Type 'RESET' to finalize clean system reset:");
          if (verify === 'RESET') {
            App.LoadingManager.show();
            App.API._call('resetSystem')
              .then(res => {
                App.LoadingManager.hide();
                if (res.success) {
                  App.UI.showSuccess("Database reset complete. All variables returned to standard templates.");
                  window.location.reload();
                } else {
                  App.UI.showError(res.message);
                }
              })
              .catch(err => {
                App.LoadingManager.hide();
                App.UI.showError("System reset failed.");
              });
          }
        }
      }
    },

    loadAuditLogs: function() {
      const tbody = document.getElementById('auditLogsTableBody');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-secondary me-2"></div>Fetching audit logs trail...</td></tr>';
      }

      App.API._call('getAuditLogs')
        .then(res => {
          this.auditLogs = res.logs || [];
          // Sort descending by timestamp/date
          this.auditLogs.sort((a, b) => {
            const timeA = new Date(a['Timestamp'] || a['Created At'] || 0).getTime();
            const timeB = new Date(b['Timestamp'] || b['Created At'] || 0).getTime();
            return timeB - timeA;
          });
          this.filteredAudits = [...this.auditLogs];
          this.currentAuditPage = 1;
          this.renderAuditTable();
        })
        .catch(err => {
          if (tbody) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4"><i class="bi bi-x-circle me-2"></i>Failed to load audit logs.</td></tr>';
          }
        });
    },

    filterAuditLogs: function(keyword) {
      if (!keyword) {
        this.filteredAudits = [...this.auditLogs];
      } else {
        const kw = keyword.toLowerCase().trim();
        this.filteredAudits = this.auditLogs.filter(log => {
          return (
            (log['Log ID'] || '').toLowerCase().includes(kw) ||
            (log['User ID'] || '').toLowerCase().includes(kw) ||
            (log['Module'] || '').toLowerCase().includes(kw) ||
            (log['Action'] || '').toLowerCase().includes(kw) ||
            (log['Description'] || '').toLowerCase().includes(kw) ||
            (log['Status'] || '').toLowerCase().includes(kw)
          );
        });
      }
      this.currentAuditPage = 1;
      this.renderAuditTable();
    },

    renderAuditTable: function() {
      const tbody = document.getElementById('auditLogsTableBody');
      if (!tbody) return;

      const total = this.filteredAudits.length;
      if (total === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">No matching audit logs found</td></tr>';
        document.getElementById('auditTableInfo').textContent = 'Showing 0 to 0 of 0 logs';
        this.renderAuditPagination(0);
        return;
      }

      const start = (this.currentAuditPage - 1) * this.auditsPerPage;
      const end = Math.min(start + this.auditsPerPage, total);
      const pageData = this.filteredAudits.slice(start, end);

      let html = '';
      pageData.forEach(log => {
        const timestamp = log['Created At'] || log['Timestamp'] || '';
        const displayTime = timestamp ? new Date(timestamp).toLocaleString() : 'N/A';
        const badgeClass = log['Status'] === 'SUCCESS' ? 'bg-success' : 'bg-danger';

        html += `
          <tr>
            <td class="text-nowrap font-monospace small">${displayTime}</td>
            <td class="fw-semibold">${App.Utils.escapeHtml(log['User ID'] || '')}</td>
            <td><span class="badge bg-secondary bg-opacity-10 text-secondary">${App.Utils.escapeHtml(log['Module'] || '')}</span></td>
            <td class="font-monospace small fw-bold">${App.Utils.escapeHtml(log['Action'] || '')}</td>
            <td class="text-wrap">${App.Utils.escapeHtml(log['Description'] || '')}</td>
            <td><span class="badge ${badgeClass} text-white">${App.Utils.escapeHtml(log['Status'] || 'SUCCESS')}</span></td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      document.getElementById('auditTableInfo').textContent = `Showing ${start + 1} to ${end} of ${total} logs`;
      this.renderAuditPagination(Math.ceil(total / this.auditsPerPage));
    },

    renderAuditPagination: function(totalPages) {
      const nav = document.getElementById('auditPagination');
      if (!nav) return;

      if (totalPages <= 1) {
        nav.innerHTML = `
          <li class="page-item disabled"><a class="page-link" href="#" tabindex="-1">Previous</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item disabled"><a class="page-link" href="#">Next</a></li>
        `;
        return;
      }

      let html = '';
      const prevDisabled = this.currentAuditPage === 1 ? 'disabled' : '';
      html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" data-page="${this.currentAuditPage - 1}">Previous</a></li>`;

      for (let i = 1; i <= totalPages; i++) {
        const active = i === this.currentAuditPage ? 'active' : '';
        html += `<li class="page-item ${active}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
      }

      const nextDisabled = this.currentAuditPage === totalPages ? 'disabled' : '';
      html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" data-page="${this.currentAuditPage + 1}">Next</a></li>`;

      nav.innerHTML = html;

      const links = nav.querySelectorAll('a.page-link');
      links.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const page = e.target.getAttribute('data-page');
          if (page) {
            this.currentAuditPage = parseInt(page, 10);
            this.renderAuditTable();
          }
        });
      });
    },

    exportAuditCSV: function() {
      if (this.filteredAudits.length === 0) {
        App.UI.showInfo("No logs to export.");
        return;
      }

      const headers = ["Timestamp", "User ID", "Module", "Action", "Description", "Status"];
      const rows = this.filteredAudits.map(log => [
        log['Created At'] || log['Timestamp'] || '',
        log['User ID'],
        log['Module'],
        log['Action'],
        log['Description'],
        log['Status']
      ]);

      let csv = "\uFEFF"; // UTF-8 BOM
      csv += headers.join(",") + "\r\n";
      rows.forEach(r => {
        csv += r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(",") + "\r\n";
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `audit_trail_export_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      App.UI.showSuccess("Audit logs exported to CSV.");
    },

    exportBackupData: function() {
      // Direct CSV fallback downloader for backup
      App.LoadingManager.show();
      
      // Pull Events list for backup
      App.API._call('getAllEvents')
        .then(events => {
          App.LoadingManager.hide();
          if (!Array.isArray(events) || events.length === 0) {
            App.UI.showInfo("No data context found to back up.");
            return;
          }

          const headers = ["Event ID", "Event Name", "Organizer", "Venue", "Start Date", "Status"];
          let csv = "\uFEFF"; // UTF-8 BOM
          csv += '"Events System Database Backup"\r\n';
          csv += headers.join(",") + "\r\n";
          
          events.forEach(e => {
            csv += [
              e.event_id || e['Event ID'],
              e.event_name || e['Event Name'],
              e.coordinator_id || e['Organizer'],
              e.venue || e['Location'],
              e.start_date || e['Start Date'],
              e.status || e['Event Status']
            ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(",") + "\r\n";
          });

          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", `system_backup_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          App.UI.showSuccess("Backup csv roster downloaded successfully.");
        })
        .catch(err => {
          App.LoadingManager.hide();
          App.UI.showError("Backup failed: " + err.message);
        });
    },

    loadDepartments: function() {
      const tbody = document.getElementById('departmentsTableBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading departments...</td></tr>';

      App.API.getAllDepartments()
        .then(depts => {
          let deptsArray = [];
          if (Array.isArray(depts)) {
            deptsArray = depts;
          } else if (depts && depts.data && Array.isArray(depts.data.departments)) {
            deptsArray = depts.data.departments;
          } else if (depts && depts.data && Array.isArray(depts.data)) {
            deptsArray = depts.data;
          } else if (depts && Array.isArray(depts.departments)) {
            deptsArray = depts.departments;
          }
          this.departmentsData = deptsArray;
          this.renderDepartments();
        })
        .catch(err => {
          if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Failed to load departments</td></tr>';
          App.UI.showError("Failed to load departments: " + err.message);
        });
    },

    renderDepartments: function() {
      const tbody = document.getElementById('departmentsTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (this.departmentsData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No departments created yet. Click "Create Department" to add one.</td></tr>';
        return;
      }

      this.departmentsData.forEach(d => {
        const id = d['Department ID'] || d.department_id || '';
        const code = d['Department Code'] || d.department_code || '';
        const name = d['Department Name'] || d.department_name || '';
        const hod = d['HOD Name'] || d.hod_name || '--';
        const empId = d['HOD Emp ID'] || d.hod_emp_id || d.hod_employee_id || '--';
        const email = d['HOD Email'] || d.hod_email || d.remarks || '--';
        const status = d['Status'] || d.status || 'Active';
        const badgeClass = status.toLowerCase() === 'active' ? 'bg-success' : 'bg-secondary';

        tbody.innerHTML += `
          <tr>
            <td class="fw-bold">${App.Utils.escapeHtml(code)}</td>
            <td>${App.Utils.escapeHtml(name)}</td>
            <td>${App.Utils.escapeHtml(hod)}</td>
            <td><span class="font-monospace small text-secondary">${App.Utils.escapeHtml(empId)}</span></td>
            <td><a href="mailto:${App.Utils.escapeHtml(email)}" class="text-decoration-none small">${App.Utils.escapeHtml(email)}</a></td>
            <td><span class="badge ${badgeClass} rounded-pill">${status}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-light text-warning me-1" data-action="edit-dept" data-id="${id}" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-light text-danger" data-action="delete-dept" data-id="${id}" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      });
    },

    openDeptModal: function(mode, id) {
      const form = document.getElementById('departmentForm');
      if (!form) return;
      form.reset();
      form.classList.remove('was-validated');

      document.getElementById('deptFormMode').value = mode;
      document.getElementById('deptFormId').value = id || '';
      document.getElementById('departmentModalLabel').innerText = mode === 'add' ? 'Create Department & Setup HOD' : 'Edit Department';

      if (mode === 'edit') {
        const d = this.departmentsData.find(x => String(x['Department ID'] || x.department_id) === String(id));
        if (d) {
          if (document.getElementById('deptCode')) document.getElementById('deptCode').value = d['Department Code'] || d.department_code || '';
          if (document.getElementById('deptName')) document.getElementById('deptName').value = d['Department Name'] || d.department_name || '';
          if (document.getElementById('deptHOD')) document.getElementById('deptHOD').value = d['HOD Name'] || d.hod_name || '';
          if (document.getElementById('deptHODEmpId')) document.getElementById('deptHODEmpId').value = d['HOD Emp ID'] || d.hod_emp_id || '';
          if (document.getElementById('deptHODEmail')) document.getElementById('deptHODEmail').value = d['HOD Email'] || d.hod_email || '';
          if (document.getElementById('deptStatus')) document.getElementById('deptStatus').value = d['Status'] || d.status || 'Active';
        }
      }

      const modalEl = document.getElementById('departmentModal');
      if (modalEl) {
        if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
          let modalObj = bootstrap.Modal.getInstance(modalEl);
          if (!modalObj) {
            modalObj = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: true });
          }
          modalObj.show();
        } else {
          modalEl.classList.add('show');
          modalEl.style.display = 'block';
        }
      }
    },

    saveDepartment: function() {
      console.log("[DEPT-05] form data collection started");
      const form = document.getElementById('departmentForm');
      if (!form) return;

      if (!form.checkValidity()) {
        console.warn("[DEPT-05a] Form HTML validation failed");
        form.classList.add('was-validated');
        return;
      }

      console.log("[DEPT-06] HTML validation passed");
      const mode = document.getElementById('deptFormMode').value;
      const id = document.getElementById('deptFormId').value;
      const deptData = {
        department_name: document.getElementById('deptName').value.trim(),
        department_code: document.getElementById('deptCode').value.trim(),
        hod_name: document.getElementById('deptHOD').value.trim(),
        hod_emp_id: document.getElementById('deptHODEmpId').value.trim(),
        hod_email: document.getElementById('deptHODEmail').value.trim(),
        status: document.getElementById('deptStatus').value
      };

      console.log("[DEPT-07] calling App.API.createDepartment with payload:", JSON.stringify(deptData));
      
      // Button Loading State Feedback UI
      const saveBtn = document.getElementById('btnSaveDept');
      let originalBtnText = "Save Department";
      if (saveBtn) {
        originalBtnText = saveBtn.innerHTML;
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Saving & Reactivating Department...';
      }

      App.LoadingManager.show();
      const apiCall = mode === 'add' ? App.API.createDepartment(deptData) : App.API.updateDepartment(id, deptData);
      apiCall.then(res => {
        console.log("[DEPT-14] backend response received by frontend promise:", res);
        App.LoadingManager.hide();
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalBtnText;
        }

        if (res && res.success === false) {
          console.error("[DEPT-14a] Backend returned error status:", res.message);
          App.UI.showError(res.message || "Failed to save department.");
          return;
        }
        
        console.log("[DEPT-15] frontend success handler displaying UI toast");
        const modalEl = document.getElementById('departmentModal');
        if (modalEl) {
          if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
          }
          modalEl.classList.remove('show');
          modalEl.style.display = 'none';
          document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
          document.body.classList.remove('modal-open');
        }
        
        var isReactivated = res && res.message && res.message.indexOf("reactivated") !== -1;
        var msg = (res && res.message) ? res.message : (mode === 'add' ? "Department created and HOD credentials dispatched!" : "Department updated.");
        if (isReactivated) {
          msg = "🔄 Department Restored & Backed Up Successfully! (Code: " + deptData.department_code + ")";
        }
        App.UI.showSuccess(msg);
        this.loadDepartments();
      }).catch(err => {
        console.error("[DEPT-14b] frontend error handler caught promise rejection:", err);
        App.LoadingManager.hide();
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalBtnText;
        }
        App.UI.showError("Failed to save department: " + (err.message || err));
      });
    },

    deleteDepartment: function(id) {
      if (!confirm("Are you sure you want to delete this department?")) return;

      App.LoadingManager.show();
      App.API.deleteDepartment(id)
        .then(res => {
          App.LoadingManager.hide();
          App.UI.showSuccess("Department deleted successfully.");
          this.loadDepartments();
        })
        .catch(err => {
          App.LoadingManager.hide();
          App.UI.showError("Failed to delete department: " + err.message);
        });
    },

    refresh: function() {
      this.loadSettings();
      if (document.getElementById('audit-panel').classList.contains('show')) {
        this.loadAuditLogs();
      }
      if (document.getElementById('departments-panel').classList.contains('show')) {
        this.loadDepartments();
      }
    },

    destroy: function() {
      // cleanup
    }
  };

  // Auto-init
  if (typeof App !== 'undefined' && App.Modules && App.Modules.settings) {
    App.Modules.settings.init();
  }
</script>
