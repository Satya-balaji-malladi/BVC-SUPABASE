<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - BVC Event Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #1e3d59;
      --secondary-color: #17a2b8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(226, 232, 240, 0.8);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      color: var(--text-dark);
      overflow-x: hidden;
      position: relative;
    }

    .main-container {
      width: 100%;
      max-width: 650px;
      z-index: 10;
    }

    .onboard-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .card-banner {
      background: linear-gradient(135deg, rgba(30, 61, 89, 0.08) 0%, rgba(23, 162, 184, 0.08) 100%);
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .college-logo {
      max-width: 80px;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .form-section {
      padding: 2rem;
    }

    .form-label {
      font-weight: 600;
      color: #334155;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }

    .form-control, .form-select {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 4px rgba(23, 162, 184, 0.15);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary-color) 0%, #173b5e 100%);
      color: white;
      border: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 15px rgba(30, 61, 89, 0.3);
      color: white;
    }

    .read-only-badge {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #475569;
      display: block;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="main-container">
    <div class="onboard-card">
      <div class="card-banner">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQlFZ_2u0RaNZlfgwlsn7JNBCW34KxzENz6uT3fX7IuA&s=10" alt="BVC Engineering College Official Logo" class="college-logo rounded mb-3" loading="lazy" style="object-fit:contain; max-width:80px; height:auto;">
        <h4 class="fw-bold mb-1" style="color: var(--primary-color);">BVC Engineering College</h4>
        <p class="text-muted small mb-0">Set up your staff account profile credentials to complete your login</p>
      </div>

      <div class="form-section">
        <div id="alertContainer" class="d-none alert alert-danger p-3 mb-4 rounded-3 small d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="alertText"></span>
        </div>

        <form id="onboardForm" novalidate>
          
          <h6 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="bi bi-person-badge me-2"></i>Profile Completion (<span id="roleLabel">User Profile</span>)</h6>
          
          <div class="row g-3 mb-4" id="roleFieldsContainer">
            <!-- Dynamic fields injected via JS based on role -->
            <div class="col-md-6">
              <label for="profFullName" class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profFullName" placeholder="Enter Full Name" required>
            </div>
            <div class="col-md-6">
              <label for="profEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="profEmail" placeholder="Enter Email" required>
            </div>
            <div class="col-md-6">
              <label for="profPhone" class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="profPhone" placeholder="Enter 10-digit Phone" pattern="[0-9]{10}" required>
            </div>
            <div class="col-md-6">
              <label for="profDept" class="form-label">Department <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profDept" placeholder="e.g. CSE, ECE" required>
            </div>

            <!-- Role specific fields -->
            <div class="col-md-6 d-none" id="groupEmpId">
              <label for="profEmpId" class="form-label" id="labelEmpId">Employee ID <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profEmpId" placeholder="Enter ID">
            </div>

            <div class="col-md-6 d-none" id="groupDesignation">
              <label for="profDesignation" class="form-label">Designation <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profDesignation" placeholder="e.g. Associate Professor">
            </div>

            <div class="col-md-6 d-none" id="groupRollNumber">
              <label for="profRollNumber" class="form-label">Roll Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profRollNumber" placeholder="e.g. 22A91A0501">
            </div>

            <div class="col-md-6 d-none" id="groupBranch">
              <label for="profBranch" class="form-label" id="labelBranch">Branch</label>
              <input type="text" class="form-control" id="profBranch" placeholder="e.g. CSE">
            </div>

            <div class="col-md-6 d-none" id="groupGuestId">
              <label for="profGuestId" class="form-label">Guest ID (Optional)</label>
              <input type="text" class="form-control" id="profGuestId" placeholder="Enter Guest ID">
            </div>
          </div>

          <button type="submit" class="btn btn-submit w-100 py-3 text-uppercase mt-2" id="btnSubmit">
            <span class="btn-text">Submit &amp; Open Dashboard</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
          </button>

        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      const sessionToken = localStorage.getItem('sessionToken');
      if (!sessionToken) {
        window.location.href = window.APP_SCRIPT_URL + "?page=login";
        return;
      }

      // Fetch user profile info
      google.script.run
        .withSuccessHandler(onUserLoaded)
        .withFailureHandler(onApiFailure)
        .authenticate(sessionToken);

      document.getElementById('onboardForm').addEventListener('submit', handleFormSubmit);
    });

    function onUserLoaded(res) {
      if (!res || !res.success || !res.user) {
        localStorage.removeItem('sessionToken');
        window.location.href = window.APP_SCRIPT_URL + "?page=login";
        return;
      }

      currentUser = res.user;
      const role = currentUser.role || currentUser.Role || 'User';
      document.getElementById('roleLabel').textContent = role;

      // Populate pre-existing values
      const firstName = currentUser.first_name || currentUser['First Name'] || '';
      const lastName = currentUser.last_name || currentUser['Last Name'] || '';
      const fullName = (firstName + ' ' + lastName).trim() || currentUser.username || '';
      
      document.getElementById('profFullName').value = fullName;
      document.getElementById('profEmail').value = currentUser.email || currentUser.email_address || currentUser['Email Address'] || '';
      document.getElementById('profPhone').value = currentUser.phone || currentUser.phone_number || currentUser['Phone Number'] || '';
      document.getElementById('profDept').value = currentUser.department || currentUser['Department'] || '';

      // Adjust visibility according to role requirements
      const normalizedRole = String(role).toLowerCase();

      if (normalizedRole.includes('faculty')) {
        document.getElementById('groupEmpId').classList.remove('d-none');
        document.getElementById('labelEmpId').innerHTML = 'Faculty ID <span class="text-danger">*</span>';
        document.getElementById('profEmpId').required = true;
        document.getElementById('profEmpId').value = currentUser.employee_id || currentUser['Employee ID'] || '';
      } else if (normalizedRole.includes('hod')) {
        document.getElementById('groupEmpId').classList.remove('d-none');
        document.getElementById('labelEmpId').innerHTML = 'Employee ID <span class="text-danger">*</span>';
        document.getElementById('profEmpId').required = true;
        document.getElementById('profEmpId').value = currentUser.employee_id || currentUser['Employee ID'] || '';
        
        document.getElementById('groupDesignation').classList.remove('d-none');
        document.getElementById('profDesignation').required = true;
        document.getElementById('profDesignation').value = currentUser.title_designation || 'Head of Department';
      } else if (normalizedRole.includes('student coordinator') || normalizedRole.includes('studentcoordinator')) {
        document.getElementById('groupRollNumber').classList.remove('d-none');
        document.getElementById('profRollNumber').required = true;
        document.getElementById('profRollNumber').value = currentUser.roll_number || '';

        document.getElementById('groupBranch').classList.remove('d-none');
        document.getElementById('labelBranch').innerHTML = 'Branch <span class="text-danger">*</span>';
        document.getElementById('profBranch').required = true;
        document.getElementById('profBranch').value = currentUser.branch || '';
      } else if (normalizedRole.includes('guest coordinator') || normalizedRole.includes('guestcoordinator')) {
        document.getElementById('groupGuestId').classList.remove('d-none');
        document.getElementById('profGuestId').value = currentUser.guest_id || '';

        document.getElementById('groupBranch').classList.remove('d-none');
        document.getElementById('labelBranch').textContent = 'Branch (Optional)';
        document.getElementById('profBranch').value = currentUser.branch || '';
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const alertCont = document.getElementById('alertContainer');
      const alertTxt = document.getElementById('alertText');

      alertCont.classList.add('d-none');

      if (!form.checkValidity()) {
        e.stopPropagation();
        form.classList.add('was-validated');
        return;
      }

      setLoading(true);

      const payload = {
        name: document.getElementById('profFullName').value.trim(),
        email: document.getElementById('profEmail').value.trim(),
        phone: document.getElementById('profPhone').value.trim(),
        department: document.getElementById('profDept').value.trim(),
        employeeId: document.getElementById('profEmpId').value.trim(),
        facultyId: document.getElementById('profEmpId').value.trim(),
        designation: document.getElementById('profDesignation').value.trim(),
        rollNumber: document.getElementById('profRollNumber').value.trim(),
        branch: document.getElementById('profBranch').value.trim(),
        guestId: document.getElementById('profGuestId').value.trim()
      };

      const sessionToken = localStorage.getItem('sessionToken');

      google.script.run
        .withSuccessHandler((res) => {
          setLoading(false);
          if (res && res.success) {
            localStorage.setItem('lastActivePage', 'dashboard');
            
            google.script.run
              .withSuccessHandler(function(html) {
                if (google.script.history && google.script.history.replace) {
                  google.script.history.replace(null, { page: 'dashboard' }, null);
                }
                document.open();
                document.write(html);
                document.close();
              })
              .getPageContent('dashboard');
          } else {
            alertTxt.textContent = res ? res.message : 'Failed to complete profile. Try again.';
            alertCont.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          setLoading(false);
          alertTxt.textContent = 'Server connection error: ' + err.message;
          alertCont.classList.remove('d-none');
        })
        .completeProfile(sessionToken, payload);
    }

    function onApiFailure(err) {
      alert('Authentication failure: ' + err.message);
      localStorage.removeItem('sessionToken');
      window.location.href = window.APP_SCRIPT_URL + "?page=login";
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      if (!btn) return;
      btn.disabled = isLoading;
      const txt = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner-border');
      if (isLoading) {
        spinner.classList.remove('d-none');
        txt.style.opacity = '0.5';
      } else {
        spinner.classList.add('d-none');
        txt.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
