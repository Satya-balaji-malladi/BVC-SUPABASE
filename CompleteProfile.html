<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile - BVC Event Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #1e3d59;
      --secondary-color: #17a2b8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(226, 232, 240, 0.8);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      color: var(--text-dark);
      overflow-x: hidden;
      position: relative;
    }

    .main-container {
      width: 100%;
      max-width: 650px;
      z-index: 10;
    }

    .onboard-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .card-banner {
      background: linear-gradient(135deg, rgba(30, 61, 89, 0.08) 0%, rgba(23, 162, 184, 0.08) 100%);
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .college-logo {
      max-width: 80px;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .form-section {
      padding: 2rem;
    }

    .form-label {
      font-weight: 600;
      color: #334155;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }

    .form-control, .form-select {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 4px rgba(23, 162, 184, 0.15);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary-color) 0%, #173b5e 100%);
      color: white;
      border: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 15px rgba(30, 61, 89, 0.3);
      color: white;
    }

    .read-only-badge {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #475569;
      display: block;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="main-container">
    <div class="onboard-card">
      <div class="card-banner">
        <img src="https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=150&q=80" alt="BVC Emblem Logo" class="college-logo rounded mb-3">
        <h4 class="fw-bold mb-1" style="color: var(--primary-color);">BVC Engineering College</h4>
        <p class="text-muted small mb-0">Set up your staff account profile credentials to complete your login</p>
      </div>

      <div class="form-section">
        <div id="alertContainer" class="d-none alert alert-danger p-3 mb-4 rounded-3 small d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="alertText"></span>
        </div>

        <form id="onboardForm" novalidate>
          
          <h6 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="bi bi-person-lines-fill me-2"></i>Account Details (Read Only)</h6>
          
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <span id="dispName" class="read-only-badge">Loading...</span>
            </div>
            <div class="col-md-6">
              <label class="form-label">Official Email</label>
              <span id="dispEmail" class="read-only-badge">Loading...</span>
            </div>
            <div class="col-md-6">
              <label class="form-label">Role</label>
              <span id="dispRole" class="read-only-badge">Loading...</span>
            </div>
            <div class="col-md-6">
              <label class="form-label">Department</label>
              <span id="dispDept" class="read-only-badge">Loading...</span>
            </div>
            <div class="col-md-12">
              <label class="form-label">User ID / Employee ID</label>
              <span id="dispIds" class="read-only-badge">Loading...</span>
            </div>
          </div>

          <h6 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="bi bi-gear-fill me-2"></i>Complete Profile Configuration</h6>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="mobileNumber" class="form-label">Mobile Number <span class="text-danger">*</span></label>
              <div class="input-group has-validation">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                <input 
                  type="tel" 
                  class="form-control" 
                  id="mobileNumber" 
                  placeholder="Enter 10-digit mobile" 
                  pattern="[0-9]{10}"
                  required
                >
                <div class="invalid-feedback">Please enter a valid 10-digit mobile number.</div>
              </div>
            </div>

            <div class="col-md-6">
              <label for="altMobile" class="form-label">Alternate Mobile (Optional)</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                <input 
                  type="tel" 
                  class="form-control" 
                  id="altMobile" 
                  placeholder="Enter alternate mobile" 
                  pattern="[0-9]{10}"
                >
              </div>
            </div>

            <div class="col-md-12">
              <label for="profilePhoto" class="form-label">Profile Photo URL (Optional)</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-image"></i></span>
                <input 
                  type="url" 
                  class="form-control" 
                  id="profilePhoto" 
                  placeholder="e.g. https://example.com/photo.jpg"
                >
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-submit w-100 py-3 text-uppercase mt-2" id="btnSubmit">
            <span class="btn-text">Submit &amp; Open Dashboard</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
          </button>

        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sessionToken = localStorage.getItem('sessionToken');
      if (!sessionToken) {
        window.location.href = window.APP_SCRIPT_URL + "?page=login";
        return;
      }

      // Fetch user profile info to pre-fill details
      google.script.run
        .withSuccessHandler(onUserLoaded)
        .withFailureHandler(onApiFailure)
        .authenticate(sessionToken);

      document.getElementById('onboardForm').addEventListener('submit', handleFormSubmit);
    });

    function onUserLoaded(res) {
      if (!res || !res.success || !res.user) {
        localStorage.removeItem('sessionToken');
        window.location.href = window.APP_SCRIPT_URL + "?page=login";
        return;
      }

      const u = res.user;
      
      const firstName = u.first_name || u['First Name'] || '';
      const lastName = u.last_name || u['Last Name'] || '';
      const fullName = (firstName + ' ' + lastName).trim() || u.Username || 'Staff Member';

      document.getElementById('dispName').textContent = fullName;
      document.getElementById('dispEmail').textContent = u.email || u['Email Address'] || 'N/A';
      document.getElementById('dispRole').textContent = u.role || u['Role'] || 'Coordinator';
      document.getElementById('dispDept').textContent = u.department || u['Department'] || 'None';
      
      const userId = u.user_id || u['User ID'] || 'N/A';
      const empId = u.employee_id || u['Employee ID'] || 'N/A';
      document.getElementById('dispIds').textContent = `User ID: ${userId} | Employee ID: ${empId}`;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const alertCont = document.getElementById('alertContainer');
      const alertTxt = document.getElementById('alertText');

      alertCont.classList.add('d-none');

      if (!form.checkValidity()) {
        e.stopPropagation();
        form.classList.add('was-validated');
        return;
      }

      setLoading(true);

      const payload = {
        phone: document.getElementById('mobileNumber').value.trim(),
        alternatePhone: document.getElementById('altMobile').value.trim(),
        profilePhoto: document.getElementById('profilePhoto').value.trim()
      };

      const sessionToken = localStorage.getItem('sessionToken');

      google.script.run
        .withSuccessHandler((res) => {
          setLoading(false);
          if (res && res.success) {
            // Save state updates
            localStorage.setItem('lastActivePage', 'dashboard');
            
            // Redirect to dashboard page
            google.script.run
              .withSuccessHandler(function(html) {
                if (google.script.history && google.script.history.replace) {
                  google.script.history.replace(null, { page: 'dashboard' }, null);
                }
                document.open();
                document.write(html);
                document.close();
              })
              .getPageContent('dashboard');
          } else {
            alertTxt.textContent = res ? res.message : 'Failed to complete profile. Try again.';
            alertCont.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          setLoading(false);
          alertTxt.textContent = 'Server connection error: ' + err.message;
          alertCont.classList.remove('d-none');
        })
        .completeProfile(sessionToken, payload);
    }

    function onApiFailure(err) {
      alert('Authentication failure: ' + err.message);
      localStorage.removeItem('sessionToken');
      window.location.href = window.APP_SCRIPT_URL + "?page=login";
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      if (!btn) return;
      btn.disabled = isLoading;
      const txt = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner-border');
      if (isLoading) {
        spinner.classList.remove('d-none');
        txt.style.opacity = '0.5';
      } else {
        spinner.classList.add('d-none');
        txt.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
