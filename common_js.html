      formatDate: function (dateStr) {
        if (!dateStr || dateStr === 'N/A') return 'N/A';
        if (typeof dateStr === 'string' && dateStr.includes('T')) {
          dateStr = dateStr.split('T')[0];
        }
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');

        if (match) {
          let hrs = parseInt(match[1], 10);
          const mins = match[2];
          const ampm = hrs >= 12 ? 'PM' : 'AM';
          let displayHrs = hrs % 12;
          if (displayHrs === 0) displayHrs = 12;
          return `${String(displayHrs).padStart(2, '0')}:${mins} ${ampm}`;

        const d = new Date(timeStr);
        if (!isNaN(d.getTime())) {
          const hrs = d.getHours();
          const mins = String(d.getMinutes()).padStart(2, '0');
          const ampm = hrs >= 12 ? 'PM' : 'AM';
          let displayHrs = hrs % 12;
          if (displayHrs === 0) displayHrs = 12;
          return `${String(displayHrs).padStart(2, '0')}:${mins} ${ampm}`;
        }
        return timeStr;

      formatLastSeen: function (dateStr) {
        if (!dateStr || dateStr === 'N/A' || dateStr === '') return 'Never';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;

        const now = new Date();
        const diffMs = now.getTime() - d.getTime();
        if (diffMs < 60000) return 'Just now';
        if (diffMs < 3600000) {
          const mins = Math.floor(diffMs / 60000);
          return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
        }

        const pad = (n) => String(n).padStart(2, '0');
        const formatTimeText = (dateObj) => {
          let hrs = dateObj.getHours();
          const mins = pad(dateObj.getMinutes());
          const ampm = hrs >= 12 ? 'PM' : 'AM';
          hrs = hrs % 12;
          if (hrs === 0) hrs = 12;
          return `${pad(hrs)}:${mins} ${ampm}`;
        };

        const isSameDay = d.getDate() === now.getDate() &&
          d.getMonth() === now.getMonth() &&
          d.getFullYear() === now.getFullYear();

        if (isSameDay) {
          return `Today ${formatTimeText(d)}`;
        }

        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const isYesterday = d.getDate() === yesterday.getDate() &&
          d.getMonth() === yesterday.getMonth() &&
          d.getFullYear() === yesterday.getFullYear();

        if (isYesterday) {
          return `Yesterday ${formatTimeText(d)}`;
        }

        return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${formatTimeText(d)}`;
      }

        if (m === 'getAllUsers') return [{ user_id: 'USR-01', full_name: 'John Doe', role: App.Constants.ROLES.COORDINATOR }];
        if (m === 'getAllStudents') return [{ roll_number: 'CSE001', student_name: 'Alice', department: 'CSE' }];
        if (m === 'getAttendanceByEvent') return [{ roll_number: 'CSE001', event_id: 'EVT-01', status: App.Constants.ATTENDANCE_STATUS.PRESENT, timestamp: '2026-07-15 10:00' }];
        if (m === 'getReportsDashboardSummary') return { success: true, report: { totalEvents: 45, totalStudents: 1250, totalAttendance: 15420, attendancePercentage: 92.08, activeEvents: 3, completedEvents: 38, highestEvent: 'Tech Symposium', lowestEvent: 'Workshop A' } };
        if (m === 'getEventReport') return [{ event_name: 'Tech Symposium', coordinator: 'John Doe', venue: 'Main Hall', start_date: '2026-07-15', end_date: '2026-07-15', participants: 120, present: 110, absent: 10, attendance_percentage: 91.67, status: 'Completed' }];
        if (m === 'getDepartmentReport' || m === 'getDepartmentComparison') return [{ department: 'CSE', total_students: 320, events_conducted: 12, attendance_percentage: 88.5, rank: 1 }];
        if (m === 'getAttendanceDefaulters') return [{ roll_number: 'CSE001', student_name: 'Alice', department: 'CSE', year: '3', events_enrolled: 5, present: 2, absent: 3, attendance_percentage: 40, status: 'Critical' }];
        if (m === 'getTopParticipants') return [{ roll_number: 'CSE002', student_name: 'Bob', department: 'CSE', year: '2', events_attended: 15, unique_events: 12 }];
        if (m === 'changePassword') return { success: true, message: 'Password updated successfully' };
        return {};
      }
    },

    // Router
    Router: {
      navigate: function (pageName) {
        if (!pageName || pageName === 'logout') return;
        if (!App.Session.hasPermission(pageName)) {
          App.UI.showError('Access Denied');
          return;
        }

        // Delegate to Index page loadPage if available
        if (typeof loadPage === 'function') {
          loadPage(pageName);
          App.State.activeModule = pageName;
          // Persist current page so it survives a browser refresh
          try { localStorage.setItem('lastActivePage', pageName); } catch (e) { }
          return;
        }

        // Cleanup previous module
        if (App.State.activeModule && App.Modules[App.State.activeModule] && typeof App.Modules[App.State.activeModule].destroy === 'function') {
          App.Modules[App.State.activeModule].destroy();
        }

        const emptyEl = document.getElementById('module-empty');
        if (emptyEl) emptyEl.classList.add('d-none');

        document.querySelectorAll('.app-module').forEach(el => el.classList.add('d-none'));

        const targetModule = document.getElementById(`module-${pageName}`);
        if (targetModule) {
          targetModule.classList.remove('d-none');
          App.State.activeModule = pageName;
          // Persist current page so it survives a browser refresh
          try { localStorage.setItem('lastActivePage', pageName); } catch (e) { }
          const mod = App.Modules[pageName];
          if (mod) {
            if (typeof mod.init === 'function') mod.init();
          } else {
            console.error('[ROUTER] Module JS not registered for:', pageName, '| App.Modules keys:', Object.keys(App.Modules));
            App.Logger.warn(`Module ${pageName} logic not found.`);
          }
        } else {
          console.error('[ROUTER] DOM element not found: #module-' + pageName);
          App.ErrorHandler.handle(new Error(`Template module-${pageName} missing.`));
        }
      }
    },

    // UI Components Architecture (Interfaces only, as requested)
    Components: {
      Table: { render: function (containerId, config) { /* implementation pending */ } },
      Modal: { create: function (config) { /* implementation pending */ } },
      Pagination: { render: function (containerId, config) { /* implementation pending */ } },
      Search: { bind: function (inputId, callback) { /* implementation pending */ } },
      Filters: { render: function (containerId, config) { /* implementation pending */ } }
    },

    // Modules Registry
    Modules: {},

    // Services Registry
    Services: {},

    // Authentication Flow Manager
    Auth: {
      init: function () {
        const token = localStorage.getItem('sessionToken');
        if (!token) {
          setTimeout(() => this.showLogin(), 500);
          return;
        }

        // Timeout guard: if server takes too long (cold start), don't immediately
        // kick the user to login — retry once before giving up
        let authSettled = false;
        const authTimeout = setTimeout(() => {
          if (!authSettled) {
            console.warn('[Auth] authenticate timed out — retrying once...');
            App.API.authenticate(token).then(res => {
              authSettled = true;
              if (res && res.success && res.user) {
                App.State.currentUser = res.user;
                const isCompleted = res.user.ProfileCompleted || res.user['ProfileCompleted'];
                if (isCompleted === false || isCompleted === 'false' || isCompleted === 'FALSE' || isCompleted === '') {
                  this.transitionToCompleteProfile();
                } else {
                  this.transitionToApp(false);
                }
              } else {
                this.logout(true);
              }
            }).catch(() => this.logout(true));
          }
        }, 12000); // wait 12s before retry

        App.API.authenticate(token).then(res => {
          authSettled = true;
          clearTimeout(authTimeout);
          if (res && res.success && res.user) {
            App.State.currentUser = res.user;
            const isCompleted = res.user.ProfileCompleted || res.user['ProfileCompleted'];
            if (isCompleted === false || isCompleted === 'false' || isCompleted === 'FALSE' || isCompleted === '') {
              this.transitionToCompleteProfile();
            } else {
              this.transitionToApp(false);
            }
          } else {
            this.logout(true);
          }
        }).catch(err => {
          authSettled = true;
          clearTimeout(authTimeout);
          console.error('[Auth] authenticate error:', err);
          this.logout(true);
        });
      },

      transitionToCompleteProfile: function () {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('d-none');
        const bg = document.getElementById('auth-bg');
        if (bg) bg.classList.add('d-none');
        const loginContainer = document.getElementById('login-container');
        if (loginContainer) loginContainer.classList.add('d-none');

        App.LoadingManager.show();
        google.script.run
          .withSuccessHandler(function (html) {
            App.LoadingManager.hide();
            if (google.script.history && google.script.history.replace) {
              google.script.history.replace(null, { page: 'completeprofile' }, null);
            }
            document.open();
            document.write(html);
            document.close();
          })
          .withFailureHandler(function (err) {
            App.LoadingManager.hide();
            console.error("Failed to load Complete Profile view:", err);
            App.UI.showError("Failed to load Complete Profile view.");
          })
          .getPageContent('completeprofile');
      },

      setSession: function (token, user) {
        localStorage.setItem('sessionToken', token);
        App.State.currentUser = user;
      },

      transitionToApp: function (fromLogin = true) {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('d-none');
        const bg = document.getElementById('auth-bg');
        if (bg) bg.classList.add('d-none');
        const loginContainer = document.getElementById('login-container');
        if (loginContainer) loginContainer.classList.add('d-none');
        const errorContainer = document.getElementById('error-container');
        if (errorContainer) errorContainer.classList.add('d-none');

        const appWrapper = document.getElementById('app-wrapper');
        if (appWrapper) appWrapper.classList.remove('d-none');

        // Update UI Header
        const userNameEl = document.getElementById('user-name');
        if (userNameEl && App.State.currentUser) {
          userNameEl.innerText = App.State.currentUser.full_name || App.State.currentUser.username || App.State.currentUser.Username || 'User';
        }
        const userRoleEl = document.getElementById('user-role-label');
        if (userRoleEl && App.State.currentUser) {
          userRoleEl.innerText = App.State.currentUser.role || App.State.currentUser.Role || 'Role';
        }

        // Role Routing
        const role = App.State.currentUser && String(App.State.currentUser.role || App.State.currentUser.Role || '').trim().toUpperCase();

        // Dynamic sidebar link visibility based on Role
        document.querySelectorAll('.sidebar-nav .nav-link[data-page]').forEach(link => {
          const pageName = String(link.getAttribute('data-page')).toLowerCase();
          const targetEl = link.closest('.nav-item') || link;
          if (!targetEl) return;

          const roleClean = String(role || '').trim().toUpperCase().replace(/[\s_]+/g, '');

          if (roleClean === 'ADMIN' || roleClean === 'HOD') {
            const allowed = ['dashboard', 'users', 'faculty', 'students', 'events', 'attendance', 'reports', 'analytics', 'settings', 'profile', 'logout'];
            if (allowed.indexOf(pageName) === -1) {
              targetEl.classList.add('d-none');
            } else {
              targetEl.classList.remove('d-none');
            }
          } else if (roleClean === 'EVENTADMIN') {
            const allowed = ['dashboard', 'events', 'attendance', 'reports', 'analytics', 'profile', 'logout'];
            if (allowed.indexOf(pageName) === -1) {
              targetEl.classList.add('d-none');
            } else {
              targetEl.classList.remove('d-none');
            }
          } else {
            // Super Admin or Developer
            if (pageName === 'monitoring' || pageName === 'testcenter') {
              if (roleClean === 'SUPERADMIN' || roleClean === 'DEVELOPER') {
                targetEl.classList.remove('d-none');
              } else {
                targetEl.classList.add('d-none');
              }
            } else {
              targetEl.classList.remove('d-none');
            }
          }
        });

        if (role === 'COORDINATOR') {
          // Force redirect to standalone Coordinator terminal page to enable camera access
          App.LoadingManager.show();
          google.script.run
            .withSuccessHandler(function (scriptUrl) {
              const token = localStorage.getItem('sessionToken');
              const coordUrl = scriptUrl + '?page=coordinator&token=' + encodeURIComponent(token);
              try {
                window.top.location.href = coordUrl;
              } catch (e) {
                window.location.href = coordUrl;
              }
            })
            .withFailureHandler(function (err) {
              console.error('Failed to get script URL during auth transition:', err);
              App.Router.navigate(App.Constants.MODULES.DASHBOARD);
            })
            .getScriptUrl();
        } else {
          if (fromLogin) {
            App.Router.navigate(App.Constants.MODULES.DASHBOARD);
          } else {
            // Refresh: restore last visited page from localStorage (survives page reload)
            let lastPage = '';
            try { lastPage = localStorage.getItem('lastActivePage') || ''; } catch (e) { }
            const restorePage = lastPage || App.State.activeModule || App.Constants.MODULES.DASHBOARD;
            App.Router.navigate(restorePage);
          }
        }
      },

      showLogin: function (sessionExpired = false) {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('d-none');
        const appWrapper = document.getElementById('app-wrapper');
        if (appWrapper) appWrapper.classList.add('d-none');
        const errorContainer = document.getElementById('error-container');
        if (errorContainer) errorContainer.classList.add('d-none');

        const bg = document.getElementById('auth-bg');
        if (bg) bg.classList.remove('d-none');
        const loginContainer = document.getElementById('login-container');
        if (loginContainer) {
          loginContainer.classList.remove('d-none');
          if (App.Modules.login) App.Modules.login.init();
          if (sessionExpired) {
            App.UI.showError('Session Expired. Please login again.');
          }
        } else {
          console.log('Not on Login page. Redirecting to Login URL...');
          const scriptUrl = window.APP_SCRIPT_URL || '';
          if (scriptUrl) {
            try {
              window.top.location.href = scriptUrl + "?page=login" + (sessionExpired ? "&expired=true" : "");
            } catch (e) {
              window.location.href = scriptUrl + "?page=login" + (sessionExpired ? "&expired=true" : "");
            }
          }
        }
      },

      logout: function (isExpired = false) {
        console.log('=== LOGOUT STARTED ===');

        const token = localStorage.getItem('sessionToken');

        // Call backend API to destroy session (async, non-blocking) before clearing local state
        if (token) {
          console.log('Calling backend logout API...');
          App.API.logout().then((res) => {
            console.log('Backend logout response:', res);
          }).catch(err => {
            console.error('Backend logout failed (non-critical):', err);
          });
        }

        // Immediately clear local state and show login
        localStorage.removeItem('sessionToken');
        try { localStorage.removeItem('lastActivePage'); } catch (e) { }
        App.State.currentUser = null;
        App.LoadingManager.hide(true);

        console.log('Local state cleared, showing login screen');
        this.showLogin(isExpired);
      },

      _clearLocalState: function (isExpired) {
        // This is now handled in logout() directly
        console.log('Clearing local state...');
      }
    }
  };

  /**
   * ==========================================
   * CORE EVENT LISTENERS
   * ==========================================
   */
  document.addEventListener('DOMContentLoaded', () => {
    App.UI.init();
    const body = document.body;

    // Layout toggles
    document.getElementById('toggle-sidebar')?.addEventListener('click', () => {
      if (window.innerWidth < 768) body.classList.add('sidebar-open');
      else body.classList.toggle('sidebar-collapsed');
    });

    document.getElementById('close-sidebar')?.addEventListener('click', () => body.classList.remove('sidebar-open'));

    // Sidebar auto-close on mobile outside click
    document.addEventListener('click', (e) => {
      if (window.innerWidth < 768 && body.classList.contains('sidebar-open')) {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');
        if (!sidebar.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target))) body.classList.remove('sidebar-open');
      }
    });

    // Global Navigation Delegation
    document.querySelectorAll('.sidebar-nav .nav-link[data-page]').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const pageName = this.getAttribute('data-page');
        console.log('Navigation clicked:', pageName);

        if (pageName === 'logout') {
          console.log('Logout button clicked');
          if (confirm('Are you sure you want to logout?')) {
            console.log('Logout confirmed by user');
            App.Auth.logout();
          } else {
            console.log('Logout cancelled by user');
          }
          return;
        }
        if (!pageName) return;
        document.querySelectorAll('.sidebar-nav .nav-link').forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        const textEl = this.querySelector('.nav-text') || this.querySelector('span');
        const textVal = textEl ? textEl.innerText : pageName;
        App.UI.updateBreadcrumb('Home', textVal);
        if (window.innerWidth < 768) body.classList.remove('sidebar-open');
        App.Router.navigate(pageName);
      });
    });

    // Live Clock
    setInterval(() => {
      const d = document.getElementById('current-date');
      const t = document.getElementById('current-time');
      if (d && t) {
        const now = new Date();
        d.innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        t.innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
    }, 1000);

    /**
     * Universal Enterprise Export Engine
     * Seamless client & server CSV, Excel & PDF exporter across all modules.
     */
    App.ExportEngine = {
      open: function (moduleType) {
        if (typeof App !== 'undefined' && App.ExportBuilder && typeof App.ExportBuilder.open === 'function') {
          App.ExportBuilder.open(moduleType);
        } else {
          console.warn(`[Export Engine] ExportBuilder modal not loaded for ${moduleType}, using direct CSV fallback`);
          this.fallbackExport(moduleType);
        }
      },

      downloadCSV: function (filename, columns, dataRows) {
        if (!Array.isArray(columns) || !Array.isArray(dataRows)) {
          App.UI.showError("Invalid export data provided");
          return;
        }
        const headerRow = columns.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',');
        const bodyRows = dataRows.map(row => {
          return columns.map(col => {
            let val = (row[col] !== undefined && row[col] !== null) ? String(row[col]) : '';
            return `"${val.replace(/"/g, '""')}"`;
          }).join(',');
        }).join('\n');

        const csvString = '\uFEFF' + headerRow + '\n' + bodyRows;
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${filename}_${new Date().getTime()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        if (typeof App !== 'undefined' && App.UI && typeof App.UI.showSuccess === 'function') {
          App.UI.showSuccess("Export downloaded successfully!");
        }
      },

      downloadExcel: function (filename, columns, dataRows) {
        if (!Array.isArray(columns) || !Array.isArray(dataRows)) {
          App.UI.showError("Invalid export data provided");
          return;
        }
        const headerRow = columns.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',');
        const bodyRows = dataRows.map(row => {
          return columns.map(col => {
            let val = (row[col] !== undefined && row[col] !== null) ? String(row[col]) : '';
            return `"${val.replace(/"/g, '""')}"`;
          }).join(',');
        }).join('\n');

        const csvString = '\uFEFF' + headerRow + '\n' + bodyRows;
        const blob = new Blob([csvString], { type: 'application/vnd.ms-excel;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${filename}_${new Date().getTime()}.xls`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        if (typeof App !== 'undefined' && App.UI && typeof App.UI.showSuccess === 'function') {
          App.UI.showSuccess("Excel export downloaded successfully!");
        }
      },

      downloadPDF: function (title, columns, dataRows, summary) {
        App.API._call('generatePrintablePdfHtml', title, {}, columns, dataRows, summary || {})
          .then(htmlStr => {
            const printWin = window.open('', '_blank');
            if (printWin) {
              setTimeout(() => {
                printWin.document.write(htmlStr);
                printWin.document.close();
              }, 150);
            } else {
              App.UI.showError("Popup blocked. Please allow popups to view PDF report.");
            }
          })
          .catch(err => {
            App.UI.showError("Failed to generate PDF: " + err.message);
          });
      },

      fallbackExport: function (moduleType) {
        let activeMod = App.Modules[moduleType];
        if (activeMod && typeof activeMod.exportToCSV === 'function') {
          activeMod.exportToCSV();
        } else {
          App.UI.showToast("Export module currently initializing.", "warning");
        }
      }
    };

    // Boot Auth flow instead of default route
    App.Auth.init();

    // Presence Heartbeat Ping Timer (run every 60s)
    setInterval(function () {
      var token = localStorage.getItem('sessionToken');
      if (token) {
        google.script.run
          .withSuccessHandler(function () {
            // Heartbeat success
          })
          .withFailureHandler(function (err) {
            console.warn("Heartbeat ping failed:", err);
          })
          .pingHeartbeat(token);
      }
    }, 60000);
  });
</script>
