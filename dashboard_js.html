<script>
  /**
   * Enterprise Dashboard JavaScript
   * Handles initialization, DOM manipulation, and frontend logic.
   * Integrates directly with the backend via google.script.run
   */

  // Call initializeDashboard directly because DOMContentLoaded has already fired in the App Shell SPA
  initializeDashboard();

  /**
   * Initializes all dashboard components
   */
  function initializeDashboard() {
    updateClock();
    setInterval(updateClock, 60000); // Update time every minute

    // Load real data
    loadDashboardData();

    // Bind Quick Actions navigation redirection
    document.querySelectorAll('.quick-action-card[data-page]').forEach(card => {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        const pageName = this.getAttribute('data-page');
        if (pageName && typeof window.loadPage === 'function') {
          window.loadPage(pageName);
        }
      });
    });

    // Initialize search input behavior
    const searchInput = document.getElementById('eventSearchInput');
    if (searchInput) {
      searchInput.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') {
          showToast('Search feature is coming soon.', 'info');
        }
      });
    }
  }

  /**
   * Updates the current date and time display in the header
   */
  function updateClock() {
    const clockEl = document.getElementById('currentDateTime');
    if (!clockEl) return;

    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    clockEl.innerHTML = `<i class="bi bi-clock me-1"></i> ${now.toLocaleDateString('en-US', options)}`;
  }

  /**
   * Main function to load all dashboard panels using google.script.run
   */
  function loadDashboardData() {
    showLoader();

    const sessionToken = localStorage.getItem('sessionToken');

    if (!sessionToken) {
      hideLoader();
      showToast('Session expired. Please log in again.', 'danger');
      console.warn("Dashboard Fetch Failed: sessionToken not found in localStorage.");
      return;
    }

    console.log("Fetching dashboard data with token:", sessionToken);

    google.script.run
      .withSuccessHandler(function (response) {
        console.log("Backend Response Received:", response);
        if (response && response.success && response.data) {
          console.log("DASHBOARD_MODULE | STEP 8 - Rendering UI");
          updateStatsUI(response.data.stats);
          loadActivitiesUI(response.data.recentActivities);
          loadEventsUI(response.data.activeEvents);
          renderDashboardChart(sessionToken);
          loadCrossDepartmentAttendance(sessionToken);
          console.log("DASHBOARD_MODULE | STEP 9 - Render completed");
        } else {
          console.error("Failed to load dashboard stats. Response structure invalid:", response);
          showToast('Error loading dashboard data.', 'danger');
        }
        hideLoader();
      })
      .withFailureHandler(function (err) {
        console.error("Google Script Run Error:", err);
        hideLoader();
        showToast('Error communicating with server.', 'danger');
      })
      .getDashboardData(sessionToken);
  }

  /**
   * Refreshes the dashboard data (triggered by manual refresh button)
   */
  function refreshDashboard() {
    loadDashboardData();
  }

  /**
   * Populates Quick Stats with real data
   */
  function updateStatsUI(stats) {
    if (!stats) return;

    // 1. Initialize role resolution & DOM handles first
    const userRole = String(localStorage.getItem('userRole') || (window.App && window.App.State && window.App.State.currentUser ? window.App.State.currentUser.role : '') || '').toUpperCase().trim().replace(/[\s_]+/g, '');
    const userDept = localStorage.getItem('userDept') || (window.App && window.App.State && window.App.State.currentUser ? window.App.State.currentUser.department : '') || '';

    const isHOD = (userRole === 'HOD');
    const isEventAdmin = (userRole === 'EVENTADMIN' || userRole === 'ADMIN');
    const isSuperAdmin = (userRole === 'SUPERADMIN' || userRole === 'SUPER_ADMIN');

    const cardDepts = document.getElementById('cardTotalDeptsContainer');
    const cardAdmins = document.getElementById('cardTotalAdminsContainer');
    const cardCrossDept = document.getElementById('crossDeptCardContainer');
    const labelCoords = document.getElementById('labelTotalCoordinators');
    const labelEvents = document.getElementById('labelActiveEvents');
    const labelTodayAtt = document.getElementById('labelTodayAttendance');

    // 2. Dynamic card labels based on Role & Department Context
    if (isHOD) {
      if (cardDepts) cardDepts.classList.add('d-none');
      if (cardAdmins) cardAdmins.classList.remove('d-none');
      if (cardCrossDept) cardCrossDept.classList.remove('d-none');
      if (labelCoords) labelCoords.textContent = userDept ? `${userDept} Coordinators` : 'Dept Coordinators';
      if (labelEvents) labelEvents.textContent = userDept ? `${userDept} Active Events` : 'Dept Active Events';
      if (labelTodayAtt) labelTodayAtt.textContent = userDept ? `${userDept} Attendance Today` : 'Dept Attendance Today';
    } else if (isEventAdmin) {
      if (cardDepts) cardDepts.classList.add('d-none');
      if (cardAdmins) cardAdmins.classList.add('d-none');
      if (cardCrossDept) cardCrossDept.classList.add('d-none');
      if (labelCoords) labelCoords.textContent = 'Assigned Coordinators';
      if (labelEvents) labelEvents.textContent = 'Events Assigned Today';
      if (labelTodayAtt) labelTodayAtt.textContent = 'Event Scans Today';
    } else {
      if (cardDepts) cardDepts.classList.remove('d-none');
      if (cardAdmins) cardAdmins.classList.add('d-none');
      if (cardCrossDept) cardCrossDept.classList.remove('d-none');
      if (labelCoords) labelCoords.textContent = 'Total Coordinators';
      if (labelEvents) labelEvents.textContent = 'Total Active Events';
      if (labelTodayAtt) labelTodayAtt.textContent = 'Total Today Attendance';
    }

    // 3. Populate Metric Values
    const totalUsersEl = document.getElementById('totalUsers');
    const activeEventsEl = document.getElementById('activeEvents');
    const todayAttendanceEl = document.getElementById('todayAttendance');
    const totalDepartmentsEl = document.getElementById('totalDepartments');
    const totalDeptAdminsEl = document.getElementById('totalDeptAdmins');

    if (totalUsersEl) totalUsersEl.textContent = (stats.totalCoordinators != null && stats.totalCoordinators !== '') ? stats.totalCoordinators : 0;
    if (totalDeptAdminsEl) totalDeptAdminsEl.textContent = (stats.totalAdmins != null && stats.totalAdmins !== '') ? stats.totalAdmins : 0;
    if (activeEventsEl) activeEventsEl.textContent = (stats.activeEvents != null && stats.activeEvents !== '') ? stats.activeEvents : 0;
    if (todayAttendanceEl) todayAttendanceEl.textContent = (stats.todayAttendance != null && stats.todayAttendance !== '') ? stats.todayAttendance : 0;
    if (totalDepartmentsEl) totalDepartmentsEl.textContent = (stats.totalDepartments != null && stats.totalDepartments !== '') ? stats.totalDepartments : 0;

    // Completed Events count
    const completedEl = document.getElementById('completedEventsCount');
    if (completedEl) completedEl.textContent = (stats.completedEvents != null) ? stats.completedEvents : 0;

    // Upcoming Events count
    const upcomingEl = document.getElementById('upcomingEventsCount');
    if (upcomingEl) upcomingEl.textContent = (stats.upcomingEvents != null) ? stats.upcomingEvents : 0;

    // Stopped Events count
    const stoppedEl = document.getElementById('stoppedEventsCount');
    if (stoppedEl) stoppedEl.textContent = (stats.stoppedEvents != null) ? stats.stoppedEvents : 0;

    // Cancelled Events count
    const cancelledEl = document.getElementById('cancelledEventsCount');
    if (cancelledEl) cancelledEl.textContent = (stats.cancelledEvents != null) ? stats.cancelledEvents : 0;

    // Cross-Dept Scans count
    const crossDeptEl = document.getElementById('crossDeptCount');
    if (crossDeptEl) crossDeptEl.textContent = (stats.crossDeptScans != null) ? stats.crossDeptScans : 0;

    // Top Event Today & Attendees Count
    const topNameEl = document.getElementById('topEventTodayName');
    const topCountEl = document.getElementById('topEventTodayCount');
    if (topNameEl) {
      const topName = stats.topEventTodayName || 'No events today';
      topNameEl.textContent = topName;
      topNameEl.title = topName;
    }
    if (topCountEl) {
      topCountEl.textContent = (stats.topEventTodayCount != null) ? stats.topEventTodayCount : 0;
    }
  }

  /**
   * Populates Recent Activities Timeline
   */
  function loadActivitiesUI(activities) {
    const timelineEl = document.getElementById('recentActivityList');
    if (!timelineEl) return;

    if (!activities || activities.length === 0) {
      timelineEl.innerHTML = '<li class="timeline-item"><div class="timeline-content"><p>No recent activity found.</p></div></li>';
      return;
    }

    let html = '';
    activities.forEach(act => {
      // Enhanced dynamic fallback for keys matching CONFIG.COLUMNS or raw log fields
      const action = act['Action'] || act.action || act['Log Action'] || 'Action';
      const module = act['Module'] || act.module || act['Log Module'] || 'System';
      const desc = act['Description'] || act.description || act['Remarks'] || '';
      const ts = act['Timestamp'] || act.timestamp || act['Created At'] || new Date().getTime();

      let type = 'info';
      if (action.toLowerCase().includes('create') || action.toLowerCase().includes('success') || action.toLowerCase().includes('login')) type = 'success';
      if (action.toLowerCase().includes('delete') || action.toLowerCase().includes('fail') || action.toLowerCase().includes('error')) type = 'danger';
      if (action.toLowerCase().includes('warn')) type = 'warning';

      const timeStr = new Date(ts).toLocaleString();

      html += `
      <li class="timeline-item">
        <div class="timeline-marker ${type}"></div>
        <div class="timeline-content">
          <h6 class="timeline-title">${module} - ${action}</h6>
          <span class="timeline-time"><i class="bi bi-clock me-1"></i>${timeStr}</span>
          <p class="timeline-desc">${desc}</p>
        </div>
      </li>
    `;
    });

    timelineEl.innerHTML = html;
  }

  /**
   * Populates Active Events Table
   */
  /**
   * Populates Active Events Table with Role-Based Isolation
   */
  function loadEventsUI(events) {
    const tbody = document.getElementById('activeEventsTableBody');
    if (!tbody) return;

    const userRole = String(localStorage.getItem('userRole') || (window.App && window.App.State && window.App.State.currentUser ? window.App.State.currentUser.role : '') || '').toUpperCase().trim().replace(/[\s_]+/g, '');
    const isHOD = (userRole === 'HOD');
    const isEventAdmin = (userRole === 'EVENTADMIN' || userRole === 'ADMIN');
    const userDept = localStorage.getItem('userDept') || (window.App && window.App.State && window.App.State.currentUser ? window.App.State.currentUser.department : '') || '';
    const selectedEventId = localStorage.getItem('selectedEventId') || (App.State && App.State.selectedEventId);

    // Update section title based on role
    const cardTitleEl = document.querySelector('#activeEventsTableBody')?.closest('.enterprise-card')?.querySelector('.enterprise-card-title');
    if (cardTitleEl) {
      if (isHOD) {
        cardTitleEl.innerHTML = `<i class="bi bi-collection-play me-2"></i>Active & Upcoming Events ${userDept ? `(${userDept})` : ''}`;
      } else if (isEventAdmin) {
        cardTitleEl.innerHTML = `<i class="bi bi-collection-play me-2"></i>My Assigned Active Events`;
      } else {
        cardTitleEl.innerHTML = `<i class="bi bi-collection-play me-2"></i>All Active & Upcoming Events`;
      }
    }

    let displayEvents = events || [];

    // Additional client-side role filtering safety for HOD / Event Admin
    if (isHOD && userDept) {
      const normDept = String(userDept).toUpperCase().replace(/[\s_]+/g, '');
      displayEvents = displayEvents.filter(evt => {
        const rawDepts = String(evt['Departments'] || evt['Department'] || evt.departments || evt.department || '').toUpperCase();
        const eventDepts = rawDepts.split(',').map(d => d.trim().replace(/[\s_]+/g, ''));
        return rawDepts === 'ALL' || eventDepts.includes(normDept);
      });
    } else if (isEventAdmin && selectedEventId) {
      displayEvents = displayEvents.filter(evt => {
        const id = evt['Event ID'] || evt.event_id || evt.eventId || '';
        return String(id).trim() === String(selectedEventId).trim();
      });
    }

    if (!displayEvents || displayEvents.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4"><i class="bi bi-info-circle me-2"></i>No active events found for your department scope.</td></tr>`;
      return;
    }

    let html = '';
    displayEvents.forEach(evt => {
      const id = evt['Event ID'] || evt.event_id || evt.eventId || '';
      const name = evt['Event Name'] || evt.eventName || evt.event_name || 'Unnamed Event';
      const dept = evt['Department'] || evt['Departments'] || evt.departments || evt.department || 'General';
      const coord = evt['Organizer'] || evt['Coordinator ID'] || evt.coordinatorId || evt.coordinator_id || 'Assigned Admin';
      const date = evt['Start Date'] || evt.startDate || evt.start_date || 'N/A';
      const time = evt['Start Time'] || evt.startTime || evt.start_time || '';
      const dateTimeStr = date + (time ? ' (' + time + ')' : '');
      const status = evt['Event Status'] || evt['Status'] || evt.status || 'Active';

      let statusClass = 'badge-active';
      if (status.toLowerCase() === 'upcoming') statusClass = 'badge-upcoming';
      if (status.toLowerCase() === 'completed') statusClass = 'badge-completed';
      if (status.toLowerCase() === 'stopped') statusClass = 'bg-warning text-dark';
      if (status.toLowerCase() === 'cancelled') statusClass = 'bg-danger text-white';

      html += `
      <tr>
        <td class="fw-semibold text-primary">${App.Utils ? App.Utils.escapeHtml(name) : name}</td>
        <td><span class="badge bg-light text-dark border">${App.Utils ? App.Utils.escapeHtml(dept) : dept}</span></td>
        <td><span class="fw-medium">${App.Utils ? App.Utils.escapeHtml(coord) : coord}</span></td>
        <td><small class="text-muted"><i class="bi bi-clock me-1"></i>${App.Utils ? App.Utils.escapeHtml(dateTimeStr) : dateTimeStr}</small></td>
        <td><span class="badge badge-enterprise ${statusClass}">${App.Utils ? App.Utils.escapeHtml(status) : status}</span></td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-primary" aria-label="View Details" onclick="if(window.App && App.State){ App.State.selectedEventId='${id}'; } if(window.App && App.Modules && App.Modules.events){ App.Modules.events.load(); } else { alert('Event ID: ${id}'); }"><i class="bi bi-eye-fill me-1"></i>View</button>
        </td>
      </tr>
    `;
    });

    tbody.innerHTML = html;
  }

  /**
   * Utility: Shows the full-screen loader
   */
  /**
   * Utility: Shows unified loading overlay
   */
  function showLoader() {
    if (window.App && window.App.LoadingManager && typeof window.App.LoadingManager.show === 'function') {
      window.App.LoadingManager.show('Loading Dashboard Data...');
    } else {
      const loader = document.getElementById('dashboardLoader');
      if (loader) loader.classList.remove('d-none');
    }
  }

  /**
   * Utility: Hides unified loading overlay cleanly
   */
  function hideLoader() {
    if (window.App && window.App.LoadingManager && typeof window.App.LoadingManager.hide === 'function') {
      window.App.LoadingManager.hide(true);
    }
    const loader = document.getElementById('dashboardLoader');
    if (loader) loader.classList.add('d-none');
  }

  /**
   * Utility: Shows a Bootstrap Toast notification
   */
  function showToast(message, type = 'primary') {
    const toastEl = document.getElementById('dashboardToast');
    const toastBody = document.getElementById('dashboardToastMessage');

    if (!toastEl || !toastBody) return;

    toastEl.className = 'toast align-items-center text-white border-0';

    let bgClass = 'bg-primary';
    if (type === 'success') bgClass = 'bg-success';
    if (type === 'danger') bgClass = 'bg-danger';
    if (type === 'warning') bgClass = 'bg-warning text-dark';
    if (type === 'info') bgClass = 'bg-info text-dark';

    bgClass.split(' ').forEach(cls => { if (cls) toastEl.classList.add(cls); });

    const closeBtn = toastEl.querySelector('.btn-close');
    if (type === 'warning' || type === 'info') {
      toastEl.classList.remove('text-white');
      if (closeBtn) closeBtn.classList.remove('btn-close-white');
    } else {
      if (closeBtn) closeBtn.classList.add('btn-close-white');
    }

    toastBody.textContent = message;

    if (typeof bootstrap !== 'undefined') {
      const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
      bsToast.show();
    } else {
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }
  }

  /**
   * Utility: Triggers a reusable confirmation modal
   */
  function confirmAction(message, onConfirm) {
    const modalEl = document.getElementById('confirmModal');
    const bodyEl = document.getElementById('confirmModalBody');
    const confirmBtn = document.getElementById('confirmModalBtn');

    if (!modalEl || !bodyEl || !confirmBtn) {
      if (window.confirm(message)) {
        if (typeof onConfirm === 'function') onConfirm();
      }
      return;
    }

    bodyEl.textContent = message;

    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);

    newBtn.addEventListener('click', function () {
      if (typeof bootstrap !== 'undefined') {
        const bsModal = bootstrap.Modal.getInstance(modalEl);
        if (bsModal) bsModal.hide();
      }
      if (typeof onConfirm === 'function') onConfirm();
    });

    if (typeof bootstrap !== 'undefined') {
      const bsModal = new bootstrap.Modal(modalEl);
      bsModal.show();
    }
  }

  /**
   * Loads trend data and renders it in a Chart.js instance on the dashboard
   */
  function renderDashboardChart(sessionToken) {
    const chartContainer = document.getElementById('attendanceChart');
    if (!chartContainer) return;

    // Statically destroy any pre-existing chart on this canvas to prevent "Canvas in use" error
    try {
      if (typeof Chart !== 'undefined' && Chart.getChart) {
        const activeChart = Chart.getChart("dashboardTrendCanvas");
        if (activeChart) activeChart.destroy();
      }
    } catch (e) { }

    chartContainer.innerHTML = '<canvas id="dashboardTrendCanvas" style="max-height: 250px; width: 100%;"></canvas>';
    const ctx = document.getElementById('dashboardTrendCanvas')?.getContext('2d');
    if (!ctx) return;

    google.script.run
      .withSuccessHandler(function (trendRes) {
        if (!trendRes || !trendRes.labels) {
          chartContainer.innerHTML = '<p class="text-center text-muted py-5">No trend data available</p>';
          return;
        }

        const labels = trendRes.labels || [];
        const rates = trendRes.rates || [];
        const volumes = trendRes.volumes || [];

        // Custom Gradient for Line
        const rateGradient = ctx.createLinearGradient(0, 0, 0, 200);
        rateGradient.addColorStop(0, 'rgba(23, 162, 184, 0.4)');
        rateGradient.addColorStop(1, 'rgba(23, 162, 184, 0.0)');

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Attendance Rate (%)',
                data: rates,
                borderColor: '#17a2b8',
                borderWidth: 3,
                backgroundColor: rateGradient,
                fill: true,
                tension: 0.4,
                yAxisID: 'yRate'
              },
              {
                label: 'Check-Ins Volume',
                data: volumes,
                borderColor: '#1e3d59',
                backgroundColor: '#1e3d59',
                type: 'bar',
                borderRadius: 6,
                barThickness: 16,
                yAxisID: 'yVol'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { boxWidth: 10 } }
            },
            scales: {
              yRate: {
                type: 'linear',
                position: 'left',
                min: 0,
                max: 100,
                ticks: { callback: v => v + '%' },
                grid: { drawOnChartArea: true }
              },
              yVol: {
                type: 'linear',
                position: 'right',
                grid: { drawOnChartArea: false },
                ticks: { precision: 0 }
              }
            }
          }
        });
      })
      .withFailureHandler(function (err) {
        console.error("Failed to load dashboard trend data", err);
        chartContainer.innerHTML = '<p class="text-center text-danger py-5">Failed to load analytics</p>';
      })
      .getTrendData(sessionToken);
  }

  // Attach crossDeptDataList to window or IIFE scope to prevent re-declaration SyntaxErrors when SPA re-injects dashboard_js.html
  window.crossDeptDataList = window.crossDeptDataList || [];

  function loadCrossDepartmentAttendance(sessionToken) {
    const container = document.getElementById('crossDeptCardContainer');
    const countEl = document.getElementById('crossDeptCount');
    if (!container) return;

    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success && response.data) {
          window.crossDeptDataList = response.data.list || [];
          if (countEl) {
            countEl.textContent = window.crossDeptDataList.length;
          }

          // Show Cross Department card ONLY for HOD
          const userRole = localStorage.getItem('userRole') || (App.currentUser && App.currentUser.role) || '';
          const roleClean = String(userRole).toUpperCase().trim().replace(/[\s_]+/g, '');
          if (roleClean === "HOD") {
            container.classList.remove("d-none");
          } else {
            container.classList.add("d-none");
          }

          // Bind click event once
          const btn = document.getElementById('btnOpenCrossDept');
          if (btn && !btn.dataset.bound) {
            btn.dataset.bound = "true";
            btn.addEventListener('click', function () {
              openCrossDeptModal();
            });
          }
        }
      })
      .withFailureHandler(function (err) {
        console.error("Failed to load cross dept attendance stats", err);
      })
      .getCrossDepartmentAttendance(sessionToken);
  }

  function openCrossDeptModal() {
    const modalEl = document.getElementById('crossDeptModal');
    if (!modalEl) return;

    // Populate branch filter options dynamically
    const branchFilter = document.getElementById('cdBranchFilter');
    if (branchFilter) {
      const branches = new Set();
      (window.crossDeptDataList || []).forEach(item => {
        if (item.branch) branches.add(item.branch);
      });
      let optionsHtml = '<option value="">All Branches</option>';
      branches.forEach(b => {
        optionsHtml += `<option value="${b}">${b}</option>`;
      });
      branchFilter.innerHTML = optionsHtml;
    }

    // Render table initially
    renderCrossDeptTable();

    // Bind filters
    const searchInput = document.getElementById('cdSearchInput');
    const branchSelect = document.getElementById('cdBranchFilter');
    const yearSelect = document.getElementById('cdYearFilter');

    const applyCdFilters = () => {
      const q = (searchInput ? searchInput.value : '').toLowerCase().trim();
      const branch = branchSelect ? branchSelect.value : '';
      const year = yearSelect ? yearSelect.value : '';

      const filtered = (window.crossDeptDataList || []).filter(item => {
        const matchSearch = !q ||
          (item.name || '').toLowerCase().includes(q) ||
          (item.roll || '').toLowerCase().includes(q) ||
          (item.eventName || '').toLowerCase().includes(q);

        const matchBranch = !branch || item.branch === branch;
        const matchYear = !year || String(item.year) === String(year);

        return matchSearch && matchBranch && matchYear;
      });

      renderCrossDeptTable(filtered);
    };

    if (searchInput && !searchInput.dataset.bound) {
      searchInput.dataset.bound = "true";
      searchInput.addEventListener('input', applyCdFilters);
    }
    if (branchSelect && !branchSelect.dataset.bound) {
      branchSelect.dataset.bound = "true";
      branchSelect.addEventListener('change', applyCdFilters);
    }
    if (yearSelect && !yearSelect.dataset.bound) {
      yearSelect.dataset.bound = "true";
      yearSelect.addEventListener('change', applyCdFilters);
    }

    const modal = new bootstrap.Modal(modalEl);
    modal.show();
  }

  function renderCrossDeptTable(data) {
    const tbody = document.getElementById('crossDeptTableBody');
    const totalCountEl = document.getElementById('cdTotalCount');
    const list = data || window.crossDeptDataList || [];

    if (totalCountEl) totalCountEl.textContent = list.length;
    if (!tbody) return;

    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No records found.</td></tr>';
      return;
    }

    const escapeHtmlHelper = (str) => {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    let html = '';
    list.forEach(item => {
      const formattedTime = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'N/A';
      html += `
      <tr>
        <td class="fw-bold font-monospace">${escapeHtmlHelper(item.roll)}</td>
        <td>${escapeHtmlHelper(item.name)}</td>
        <td><span class="badge bg-light text-dark">${escapeHtmlHelper(item.dept)}</span></td>
