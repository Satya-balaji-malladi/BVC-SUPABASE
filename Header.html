<header class="top-header sticky-top border-bottom" style="background-color: var(--bg-card); height: var(--bvc-header-height);">
  <div class="d-flex align-items-center justify-content-between h-100 px-3 px-md-4">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-link text-secondary p-0" id="toggle-sidebar" aria-label="Toggle Navigation Sidebar">
        <i class="bi bi-list fs-3"></i>
      </button>
      
      <!-- Breadcrumb Area -->
      <nav aria-label="breadcrumb" class="d-none d-md-block">
        <ol class="breadcrumb mb-0" id="breadcrumb-container">
          <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-secondary" id="breadcrumb-parent">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="current-page-title" style="color: var(--text-primary); font-weight: 500;">Dashboard</li>
        </ol>
      </nav>
    </div>

    <!-- Header Actions -->
    <div class="d-flex align-items-center gap-3">
      <!-- Search Trigger Widget -->
      <button class="btn btn-light btn-sm text-secondary d-none d-md-flex align-items-center gap-2 border px-2.5 py-1.5" id="btnHeaderSearch" style="border-radius: var(--radius-input); background-color: var(--bg-app);">
        <i class="bi bi-search small"></i>
        <span class="small me-4">Search...</span>
        <kbd class="bg-white text-muted border px-1.5 py-0.5 small font-monospace">Ctrl+K</kbd>
      </button>

      <!-- Instant Theme Toggle Switch -->
      <button class="btn btn-link text-secondary p-1" id="btnThemeToggle" aria-label="Toggle Color Theme" style="border-radius: var(--radius-btn);">
        <i class="bi bi-sun fs-5" id="themeSunIcon"></i>
        <i class="bi bi-moon fs-5 d-none" id="themeMoonIcon"></i>
      </button>

      <!-- Role & Department Tags -->
      <div class="d-none d-lg-flex align-items-center gap-2">
        <span class="badge bg-primary text-white py-1 px-2.5" id="headerRoleBadge" style="border-radius: 8px;">Role</span>
        <span class="badge bg-secondary py-1 px-2.5 text-white" id="headerDeptBadge" style="border-radius: 8px;">Department</span>
      </div>

      <!-- User Dropdown Menu -->
      <div class="dropdown">
        <button class="btn btn-link text-decoration-none p-0 d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
          <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px; border-radius: 50%;">
            <span id="user-initials" class="fw-bold small">--</span>
          </div>
          <div class="d-none d-md-block text-start lh-sm">
            <div class="fw-semibold small" id="user-name" style="color: var(--text-primary);">User</div>
            <small class="text-secondary" style="font-size: 11px;" id="user-role">Role</small>
          </div>
          <i class="bi bi-chevron-down d-none d-md-block text-secondary small ms-1"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end border-0 shadow mt-2" style="border-radius: var(--radius-card); background-color: var(--bg-card); border: 1px solid var(--border-color) !important;">
          <li><a class="dropdown-item py-2 small" href="javascript:void(0)" onclick="loadPage('Profile')"><i class="bi bi-person me-2"></i> Profile</a></li>
          <li><a class="dropdown-item py-2 small" href="javascript:void(0)" onclick="loadPage('Settings')"><i class="bi bi-gear me-2"></i> Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item py-2 small text-danger" href="javascript:void(0)" id="headerLogoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</header>
