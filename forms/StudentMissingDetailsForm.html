<!-- StudentMissingDetailsForm.html -->
<div class="modal fade" id="studentMissingDetailsModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content af-modal-content">
      <div class="modal-header af-modal-header bg-warning text-dark">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-pencil-square me-2"></i>Complete Student Profile
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="alert alert-warning border-0 rounded-3 small mb-3">
          <i class="bi bi-exclamation-circle-fill me-1"></i> Required details are missing in this student's profile. Fill highlighted fields to continue.
        </div>

        <form id="studentMissingDetailsForm">
          <!-- Read-only header details -->
          <div class="p-3 bg-light rounded-3 border mb-3">
            <div class="row g-2">
              <div class="col-6">
                <span class="small text-muted d-block">Name</span>
                <strong id="missingReadOnlyName">--</strong>
              </div>
              <div class="col-6">
                <span class="small text-muted d-block">Roll Number</span>
                <strong id="missingReadOnlyRoll" class="font-monospace">--</strong>
              </div>
            </div>
          </div>

          <!-- Missing Input Fields Container -->
          <div id="missingFieldsDynamicInputs" class="row g-3">
            <!-- Dynamically injected editable missing fields -->
          </div>
        </form>
      </div>
      <div class="modal-footer af-modal-footer">
        <button type="button" class="btn btn-outline-secondary af-btn" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning af-btn fw-bold" id="btnConfirmSaveProfileAndMark">
          <i class="bi bi-save-fill me-1"></i> Save Profile & Mark Present
        </button>
      </div>
    </div>
  </div>
</div>
