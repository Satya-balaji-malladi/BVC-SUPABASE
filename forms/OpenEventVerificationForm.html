<!-- OpenEventVerificationForm.html -->
<div class="modal fade" id="openEventVerificationModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content af-modal-content">
      <div class="modal-header af-modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="openEventModalTitle">
          <i class="bi bi-person-check-fill me-2"></i>Verify Participant Profile
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <!-- Container for dynamically injected profile card -->
        <div id="openEventProfileContainer"></div>

        <div class="row g-2 id="openEventConfiguredFields">
          <!-- Dynamic Event Admin configured read-only fields -->
        </div>
      </div>
      <div class="modal-footer af-modal-footer">
        <button type="button" class="btn btn-outline-secondary af-btn" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary af-btn af-btn-primary" id="btnConfirmOpenEventMark">
          <i class="bi bi-check-circle-fill me-1"></i> Mark Present
        </button>
      </div>
    </div>
  </div>
</div>
