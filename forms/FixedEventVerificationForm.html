<!-- FixedEventVerificationForm.html -->
<div class="modal fade" id="fixedEventVerificationModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content af-modal-content">
      <div class="modal-header af-modal-header bg-success text-white">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-shield-check me-2"></i>Fixed Event - Participant Verification
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <!-- Registered Profile Card -->
        <div id="fixedEventProfileContainer"></div>

        <div class="p-3 bg-light rounded-3 border mb-3">
          <div class="row g-2">
            <div class="col-6">
              <span class="small text-muted d-block">Registration Status</span>
              <span class="badge bg-success bg-opacity-10 text-success border border-success-subtle fw-semibold px-2 py-1" id="fixedRegStatus">Registered & Approved</span>
            </div>
            <div class="col-6">
              <span class="small text-muted d-block">Seat / Desk No.</span>
              <span class="fw-bold text-dark" id="fixedSeatNumber">N/A</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer af-modal-footer">
        <button type="button" class="btn btn-outline-secondary af-btn" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success af-btn" id="btnConfirmFixedEventMark">
          <i class="bi bi-check-circle-fill me-1"></i> Mark Present
        </button>
      </div>
    </div>
  </div>
</div>
