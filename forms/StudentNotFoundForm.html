<!-- StudentNotFoundForm.html -->
<div class="modal fade" id="studentNotFoundModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content af-modal-content">
      <div class="modal-header af-modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-person-x-fill me-2"></i>Student Not Found
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="alert alert-danger border-0 rounded-3 mb-3 d-flex align-items-center">
          <i class="bi bi-exclamation-octagon-fill fs-3 me-3"></i>
          <div>
            <strong>Student Record Missing!</strong><br />
            <span class="small">The scanned roll number does not exist in the database. Register student below to mark attendance.</span>
          </div>
        </div>

        <form id="studentNotFoundForm">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Roll Number <span class="text-danger">*</span></label>
            <input type="text" class="form-control af-form-control font-monospace" id="newStudentRollInput" readonly />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Student Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control af-form-control" id="newStudentNameInput" placeholder="Enter full name" required />
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Department <span class="text-danger">*</span></label>
              <select class="form-select af-form-control" id="newStudentDeptSelect" required>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="CIVIL">CIVIL</option>
                <option value="MECH">MECH</option>
                <option value="AIDS">AIDS</option>
                <option value="AIML">AIML</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Year <span class="text-danger">*</span></label>
              <select class="form-select af-form-control" id="newStudentYearSelect" required>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Section</label>
              <input type="text" class="form-control af-form-control" id="newStudentSectionInput" placeholder="e.g. A" />
            </div>
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Gender</label>
              <select class="form-select af-form-control" id="newStudentGenderSelect">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="mb-3" id="newStudentCollegeGroup">
            <label class="form-label small fw-bold text-muted">College / Institution <span class="text-danger">*</span></label>
            <input type="text" class="form-control af-form-control" id="newStudentCollegeInput" placeholder="Enter college name" required />
          </div>
        </form>
      </div>
      <div class="modal-footer af-modal-footer">
        <button type="button" class="btn btn-outline-secondary af-btn" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger af-btn" id="btnConfirmCreateAndMark">
          <i class="bi bi-person-plus-fill me-1"></i> Save Student & Mark Present
        </button>
      </div>
    </div>
  </div>
</div>
