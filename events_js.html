              el.disabled = false;
              el.readOnly = false;
            }
          });
        }

        // Configure Layout and Fields for Edit mode
        document.getElementById('eventModalStepsNav').classList.remove('d-none');
        document.getElementById('advancedEventFields').classList.remove('d-none');
        ['eventStartDate', 'eventEndDate', 'eventStartTime', 'eventEndTime', 'eventVenue'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.required = true;
        });

        // Creator Identity Lock checks
        const currentUserId = localStorage.getItem('userId') || (App.State && App.State.currentUser && (App.State.currentUser.user_id || App.State.currentUser['User ID'])) || '';
        const creatorId = evt.created_by || evt['Created By'] || '';
        const isCreator = String(currentUserId).trim() === String(creatorId).trim();
        
        const nameInput = document.getElementById('eventName');
        const descInput = document.getElementById('eventDescription');
        if (nameInput) nameInput.disabled = !isCreator;
        if (descInput) descInput.disabled = !isCreator;

        ['eventStartDate', 'eventEndDate', 'eventRegOpen', 'eventRegClose'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.removeAttribute('min');
        });
        
        document.getElementById('eventModalLabel').textContent = 'Edit Event';
        const tlContainer = document.getElementById('eventTimelineContainer');
        if (tlContainer) tlContainer.classList.add('d-none');
        
        document.getElementById('eventOriginalId').value = evt.event_id;
        document.getElementById('eventId').value = evt.event_id;
        document.getElementById('eventId').readOnly = true;
        document.getElementById('eventId').disabled = true;
        
        const formatDateTimeFriendly = (isoString) => {
          if (!isoString || isoString === 'N/A') return 'N/A';
          const d = new Date(isoString);
          if (isNaN(d.getTime())) return isoString;
          const pad = (n) => n.toString().padStart(2, '0');
          let hours = d.getHours();
          const ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12;
          hours = hours ? hours : 12;
          return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(hours)}:${pad(d.getMinutes())} ${ampm}`;
        };

        document.getElementById('eventCreatedAt').value = formatDateTimeFriendly(evt.created_at);
        document.getElementById('eventCreatedAt').readOnly = true;
        document.getElementById('eventCreatedAt').disabled = true;
        
        const formatDateForInput = (dateVal) => {
          if (!dateVal || dateVal === 'N/A') return '';
          if (typeof dateVal === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateVal)) return dateVal;
          if (typeof dateVal === 'string' && dateVal.includes('T')) return dateVal.split('T')[0];
          const d = new Date(dateVal);
          if (isNaN(d.getTime())) return '';
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        };

        const formatTimeForInput = (timeVal) => {
          if (!timeVal || timeVal === 'N/A') return '';
          const tStr = String(timeVal).trim();
          const match = tStr.match(/^(\d{1,2}):(\d{2})/);
          if (match) return `${match[1].padStart(2, '0')}:${match[2]}`;
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          return '';
        };

        document.getElementById('eventName').value = evt.event_name || '';
        document.getElementById('eventDescription').value = evt.description || '';
        document.getElementById('eventStartDate').value = formatDateForInput(evt.start_date);
        document.getElementById('eventEndDate').value = formatDateForInput(evt.end_date);
        document.getElementById('eventStartTime').value = formatTimeForInput(evt.start_time);
        document.getElementById('eventEndTime').value = formatTimeForInput(evt.end_time);
        document.getElementById('eventCapacity').value = evt.capacity || '';

        // Populate Registration settings
        const regEnabled = evt['Enable Registration'] === 'Yes' || evt.enable_registration === 'Yes' || evt.enableRegistration === 'Yes';
        const checkboxEnable = document.getElementById('eventEnableRegistration');
        if (checkboxEnable) {
          checkboxEnable.checked = regEnabled;
          const container = document.getElementById('eventRegSettingsContainer');
          if (regEnabled) {
            if (container) container.classList.remove('d-none');
          } else {
            if (container) container.classList.add('d-none');
          }
        }

        const formatDateTimeLocal = (dateVal) => {
          if (!dateVal || dateVal === 'N/A') return '';
          const d = new Date(dateVal);
          if (isNaN(d.getTime())) return dateVal;
          const pad = (num) => String(num).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const openTimeVal = evt['Registration Open Date & Time'] || evt.registration_open || '';
        const closeTimeVal = evt['Registration Close Date & Time'] || evt.registration_close || '';
        document.getElementById('eventRegOpen').value = formatDateTimeLocal(openTimeVal);
        document.getElementById('eventRegClose').value = formatDateTimeLocal(closeTimeVal);
        document.getElementById('eventRegMaxSeats').value = evt['Maximum Seats'] || evt.maximum_seats || '';
        
        const spotEnabled = evt['Allow Spot Registration'] === 'Yes' || evt.allow_spot_registration === 'Yes' || evt.allowSpot === 'Yes';
        const checkboxSpot = document.getElementById('eventAllowSpotReg');
        const checkboxSpotStep1 = document.getElementById('eventAllowSpotRegStep1');
        if (checkboxSpot) checkboxSpot.checked = spotEnabled;
        if (checkboxSpotStep1) checkboxSpotStep1.checked = spotEnabled;

        document.getElementById('eventRegTerms').value = evt['Terms & Conditions'] || evt.terms || '';

        // Render dynamic custom fields
        const cFieldsContainer = document.getElementById('regCustomFieldsContainer');
        if (cFieldsContainer) cFieldsContainer.innerHTML = '';
        
        const fieldsJsonStr = evt['Registration Fields'] || evt.registration_fields || '';
        if (fieldsJsonStr) {
          try {
            const fieldsArray = JSON.parse(fieldsJsonStr);
            if (Array.isArray(fieldsArray)) {
              fieldsArray.forEach(f => {
                this.addCustomFieldRow(f);
              });
            }
          } catch(jsonErr) {
            App.Logger.error("Failed to parse custom fields JSON during edit: " + jsonErr.message);
          }
        }

        // Enforce lock if registration has already closed
        const closeTime = new Date(closeTimeVal);
        const isRegClosed = regEnabled && !isNaN(closeTime.getTime()) && closeTime < new Date();
        
        const regInputsList = [
          'eventEnableRegistration',
          'eventRegOpen',
          'eventRegClose',
          'eventRegMaxSeats',
          'eventAllowSpotReg',
          'eventRegTerms',
          'btnRegAddCustomField'
        ];
        regInputsList.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.disabled = isRegClosed;
        });

        // Initialize wizard step
        this.goToStep(1);

        document.getElementById('eventVenue').value = evt.venue || '';
        document.getElementById('eventCoordinator').value = evt.coordinator_id || '';
        
        const dptArr = (evt.departments || '').split(',').map(s=>s.trim());
        document.querySelectorAll('.event-dept-check').forEach(cb => {
          cb.checked = dptArr.includes(cb.value);
        });
        
        const yrArr = (evt.years || '').split(',').map(s=>s.trim());
        document.querySelectorAll('.event-year-check').forEach(cb => {
          cb.checked = yrArr.includes(cb.value);
        });
        
        // Update Dropdown Text
        const updateText = (checks, spanId, defaultText) => {
          const selected = Array.from(checks).filter(c => c.checked);
          document.getElementById(spanId).textContent = selected.length > 0 ? `Selected (${selected.length})` : defaultText;
        };
        updateText(document.querySelectorAll('.event-dept-check'), 'eventDepartmentsDropdownText', 'Select Departments');
        updateText(document.querySelectorAll('.event-year-check'), 'eventYearsDropdownText', 'Select Years');
        
        document.getElementById('eventCapacity').value = evt.capacity || '';

        // Populate Attendance Access Restrictions
        const resType = evt.access_restriction_type || evt['Access Restriction Type'] || 'ALL_COORDINATORS';
        const radAll = document.getElementById('accessTypeAll');
        const radSpec = document.getElementById('accessTypeSpecific');
        const radDept = document.getElementById('accessTypeDept');

        if (resType === 'SPECIFIC_COORDINATORS' && radSpec) radSpec.checked = true;
        else if (resType === 'DEPT_ONLY' && radDept) radDept.checked = true;
        else if (radAll) radAll.checked = true;

        let allowedCoords = evt.allowed_coordinator_ids || evt['Allowed Coordinator IDs'] || [];
        if (typeof allowedCoords === 'string') {
          try { allowedCoords = JSON.parse(allowedCoords); } catch(e) { allowedCoords = allowedCoords.split(',').map(s=>s.trim()); }
        }
        if (!Array.isArray(allowedCoords)) allowedCoords = [];

        document.querySelectorAll('.allowed-coord-check').forEach(cb => {
          cb.checked = allowedCoords.includes(cb.value);
        });

        let allowedDepts = evt.allowed_departments || evt['Allowed Departments'] || [];
        if (typeof allowedDepts === 'string') {
          try { allowedDepts = JSON.parse(allowedDepts); } catch(e) { allowedDepts = allowedDepts.split(',').map(s=>s.trim()); }
        }
        if (!Array.isArray(allowedDepts)) allowedDepts = [];

        document.querySelectorAll('.allowed-dept-check').forEach(cb => {
          cb.checked = allowedDepts.includes(cb.value);
        });

        const checkedCoordsCount = document.querySelectorAll('.allowed-coord-check:checked').length;
        const textSpan = document.getElementById('allowedCoordsDropdownText');
        if (textSpan) {
          textSpan.textContent = checkedCoordsCount > 0 ? `Selected Coordinators (${checkedCoordsCount})` : 'Select Coordinators...';
        }

        const specContainer = document.getElementById('specificCoordinatorsContainer');
        const deptContainer = document.getElementById('allowedDeptsContainer');
        if (specContainer) {
          if (resType === 'SPECIFIC_COORDINATORS') specContainer.classList.remove('d-none');
          else specContainer.classList.add('d-none');
        }
        if (deptContainer) {
          if (resType === 'DEPT_ONLY') deptContainer.classList.remove('d-none');
          else deptContainer.classList.add('d-none');
        }

        // Show/hide fixed options vs open options
        const attType = evt['Attendance Type'] || evt.attendance_type || 'Fixed';
        document.getElementById('eventAttendanceType').value = attType;
        const fixedOptions = document.getElementById('fixed-event-options');
        const openOptions = document.getElementById('open-event-options');

        if (attType === 'Fixed') {
          if (fixedOptions) fixedOptions.classList.remove('d-none');
          if (openOptions) openOptions.classList.add('d-none');

          const subgroup = evt['Fixed Subgroup'] || evt.fixedSubgroup || 'ALL';
          const radAll = document.getElementById('groupAllColleges');
          const radBvc = document.getElementById('groupBVC');
          if (subgroup === 'ALL') {
            if (radAll) radAll.checked = true;
          } else {
            if (radBvc) radBvc.checked = true;
          }

          // Update checkboxes visibility
          const infoAll = document.getElementById('info-fields-all-colleges');
          const infoBvc = document.getElementById('info-fields-bvc-only');
          if (subgroup === 'ALL') {
            if (infoAll) { infoAll.classList.remove('d-none'); infoAll.classList.add('d-flex'); }
            if (infoBvc) { infoBvc.classList.remove('d-flex'); infoBvc.classList.add('d-none'); }
          } else {
            if (infoAll) { infoAll.classList.remove('d-flex'); infoAll.classList.add('d-none'); }
            if (infoBvc) { infoBvc.classList.remove('d-none'); infoBvc.classList.add('d-flex'); }
          }

          // Check required checkboxes
          const gatherFields = (evt['Required Info Fields'] || evt.gatherFields || '').split(',').map(s => s.trim());
          document.querySelectorAll('.info-field-chk').forEach(cb => {
            if (cb.value !== 'Name' && cb.value !== 'Roll Number') {
              cb.checked = gatherFields.includes(cb.value);
            }
          });
        } else {
          if (fixedOptions) fixedOptions.classList.add('d-none');
          if (openOptions) openOptions.classList.remove('d-none');

          const openTargetVal = evt.open_target_group || evt['Open Target Group'] || 'BVC';
          const openTargetSelect = document.getElementById('openEventTargetGroup');
          if (openTargetSelect) {
            openTargetSelect.value = openTargetVal;
            openTargetSelect.dispatchEvent(new Event('change'));
          }

          let openFields = evt.open_required_fields || evt['Open Required Fields'] || '';
          if (typeof openFields === 'string') {
            try { openFields = JSON.parse(openFields); } catch(e) { openFields = openFields.split(',').map(s=>s.trim()); }
          }
          if (!Array.isArray(openFields)) openFields = [];

          document.querySelectorAll('.open-field-chk').forEach(cb => {
            if (cb.value !== 'Roll / Registration Number' && cb.value !== 'Student Full Name') {
              cb.checked = openFields.includes(cb.value);
            }
          });
        }

        // Hide new coordinator fields
        const newCoordFields = document.getElementById('new-coordinator-fields');
        if (newCoordFields) newCoordFields.classList.add('d-none');
        ['newCoordFirstName', 'newCoordLastName', 'newCoordEmail', 'newCoordEmployeeId'].forEach(id => {
          const input = document.getElementById(id);
          if (input) input.required = false;
        });

        document.getElementById('eventOriginalStatus').value = evt.status || 'Draft';
        
        document.getElementById('eventCreationActionGroup').classList.add('d-none');
        document.getElementById('eventCurrentStatusGroup').classList.remove('d-none');
        
        // Status Badge
        const badgeMap = {
          'Draft': 'bg-secondary',
          'Upcoming': 'bg-primary',
          'Active': 'bg-success',
          'Stopped': 'bg-dark',
          'Completed': 'bg-info',
          'Cancelled': 'bg-danger'
        };
        const currentStatus = evt.status || 'Draft';
        const badgeClass = badgeMap[currentStatus] || 'bg-secondary';
        document.getElementById('eventCurrentStatusBadge').innerHTML = `<span class="badge ${badgeClass}">${currentStatus}</span>`;
        
        document.getElementById('eventIdGroup').classList.remove('d-none');
        document.getElementById('eventCreatedAtGroup').classList.remove('d-none');
        
        const banner = document.getElementById('eventLockedBanner');
        const saveBtn = document.getElementById('eventSaveBtn');
        
        // Check lock conditions
        const stat = (evt.status || '').toLowerCase();
        let isLocked = stat === 'cancelled';
        
        if (stat === 'completed') {
          const completedAtStr = evt.completed_at || '';
          if (completedAtStr) {
            const completedTime = new Date(completedAtStr).getTime();
            const nowTime = new Date().getTime();
            const diffDays = (nowTime - completedTime) / (1000 * 60 * 60 * 24);
            if (diffDays > 7 || evt.archive_status === 'ReadOnly') {
              isLocked = true;
            }
          } else {
            isLocked = true;
          }
        }
        
        if (isLocked) {
          if (banner) banner.classList.remove('d-none');
          if (saveBtn) saveBtn.classList.add('d-none');
          if (tlContainer) tlContainer.classList.add('d-none'); // Hide preview just in case
          // Disable all form elements
          Array.from(form.elements).forEach(el => {
            if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') {
              el.disabled = true;
            }
          });
        } else {
          if (banner) banner.classList.add('d-none');
          if (saveBtn) {
            document.getElementById('eventSaveBtnText').textContent = 'Update Event';
          }
          this.evaluateLifecycleActions(stat);
        }
        
        const errorAlert = document.getElementById('eventModalError');
        if (errorAlert) errorAlert.classList.add('d-none');
        
        const modalEl = document.getElementById('eventModal');
        if (modalEl) {
          const modal = new bootstrap.Modal(modalEl);
          modal.show();
        }
      })
      .catch(err => {
        this.setModalLoading(false);
        App.UI.showError(err.message || "Failed to fetch event data.");
      });
  },

  openDeleteEventModal: function(id) {
    document.getElementById('deleteEventId').value = id;
    const modalEl = document.getElementById('eventDeleteModal');
    if (modalEl) {
      const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
      modal.show();
    }
  },

  setModalLoading: function(isLoading) {
    const btn = document.getElementById('eventSaveBtn');
    const spinner = document.getElementById('eventSaveSpinner');
    if (btn) btn.disabled = isLoading;
    if (spinner) {
      if (isLoading) spinner.classList.remove('d-none');
      else spinner.classList.add('d-none');
    }
  },

  handleEventSubmit: function(e) {
    e.preventDefault();
    const form = e.target;
    const errorAlert = document.getElementById('eventModalError');
    
    if (!form.checkValidity()) {
      e.stopPropagation();
      form.classList.add('was-validated');
      return;
    }
    
    // Custom Validations
    const stTime = document.getElementById('eventStartTime').value;
    const enTime = document.getElementById('eventEndTime').value;
    const eventStartDateStr = document.getElementById('eventStartDate').value;
    const eventEndDateStr = document.getElementById('eventEndDate').value;

    if (stTime && enTime && eventStartDateStr === eventEndDateStr && stTime >= enTime) {
      if (errorAlert) {
        errorAlert.textContent = "End Time must be strictly after Start Time on the same day.";
        errorAlert.classList.remove('d-none');
      }
      return;
    }

    const isEdit = !!document.getElementById('eventOriginalId').value;
    
    if (eventStartDateStr && eventEndDateStr && eventStartDateStr > eventEndDateStr) {
      if (errorAlert) {
        errorAlert.textContent = "End Date must be greater than or equal to Start Date.";
        errorAlert.classList.remove('d-none');
      }
      return;
    }
    
    if (!isEdit && eventStartDateStr) {
      // Past Date validation only on Create
      const today = new Date();
      today.setHours(0,0,0,0);
      const evDate = new Date(eventStartDateStr);
      if (evDate < today) {
        if (errorAlert) {
          errorAlert.textContent = "Cannot create an event in the past.";
          errorAlert.classList.remove('d-none');
        }
        return;
      }
    }
    
    this.setModalLoading(true);
    if (errorAlert) errorAlert.classList.add('d-none');
    
    const originalId = document.getElementById('eventOriginalId').value;
    
    const depts = Array.from(document.querySelectorAll('.event-dept-check:checked')).map(cb => cb.value).join(',');
    const years = Array.from(document.querySelectorAll('.event-year-check:checked')).map(cb => cb.value).join(',');
    
    if (isEdit) {
      document.getElementById('eventDepartments').value = depts;
      document.getElementById('eventYears').value = years;

      if (!depts) {
        if (errorAlert) {
          errorAlert.textContent = "At least one Department is required.";
          errorAlert.classList.remove('d-none');
        }
        this.setModalLoading(false);
        return;
      }
    } else {
      // Create path: default department to coordinator's or current HOD's department
      const userDept = localStorage.getItem('userDept') || '';
      document.getElementById('eventDepartments').value = userDept;
      document.getElementById('eventYears').value = '1,2,3,4';
    }
    
    let currentTargetStatus = '';
    if (!isEdit) {
      currentTargetStatus = document.getElementById('eventCreationAction').value;
    } else {
      const pendingAction = document.getElementById('eventSaveBtn').getAttribute('data-pending-action');
      const origStatus = document.getElementById('eventOriginalStatus').value || 'Draft';
      if (pendingAction === 'Publish') currentTargetStatus = 'Upcoming';
      else if (pendingAction === 'Cancel') currentTargetStatus = 'Cancelled';
      else if (pendingAction === 'Stop') currentTargetStatus = 'Stopped';
      else currentTargetStatus = origStatus;
    }
    
    const attType = document.getElementById('eventAttendanceType') ? document.getElementById('eventAttendanceType').value : 'Fixed';
    let subgroup = '';
    let requiredFields = '';

    if (attType === 'Fixed') {
      subgroup = document.querySelector('input[name="fixedSubgroup"]:checked') ? document.querySelector('input[name="fixedSubgroup"]:checked').value : 'ALL';
      const infoFieldsGroup = (subgroup === 'ALL') ? '#info-fields-all-colleges' : '#info-fields-bvc-only';
      requiredFields = Array.from(document.querySelectorAll(infoFieldsGroup + ' .info-field-chk:checked')).map(cb => cb.value).join(',');
    }

    const accessRestrictionType = document.querySelector('input[name="accessRestrictionType"]:checked')?.value || 'ALL_COORDINATORS';
    const allowedCoordinatorIds = Array.from(document.querySelectorAll('.allowed-coord-check:checked')).map(cb => cb.value);
    const allowedDepartments = Array.from(document.querySelectorAll('.allowed-dept-check:checked')).map(cb => cb.value);

    const openTargetGroup = document.getElementById('openEventTargetGroup') ? document.getElementById('openEventTargetGroup').value : 'BVC';
    const openRequiredFields = Array.from(document.querySelectorAll('.open-field-chk:checked')).map(cb => cb.value);

    const eventData = {
      event_name: document.getElementById('eventName').value.trim(),
      description: document.getElementById('eventDescription').value.trim(),
      start_date: eventStartDateStr,
      end_date: eventEndDateStr,
      start_time: stTime,
      end_time: enTime,
      venue: document.getElementById('eventVenue').value.trim(),
      coordinator_id: document.getElementById('eventCoordinator').value,
      departments: depts,
      years: years,
      capacity: document.getElementById('eventCapacity').value,
      status: currentTargetStatus,

      access_restriction_type: accessRestrictionType,
      allowed_coordinator_ids: allowedCoordinatorIds,
      allowed_departments: allowedDepartments,

      open_target_group: openTargetGroup,
      open_required_fields: openRequiredFields,
      
      attendance_type: attType,
      'Attendance Type': attType,
      'Fixed Subgroup': subgroup,
      'Required Info Fields': requiredFields,
      
      enable_registration: document.getElementById('eventEnableRegistration').checked ? 'Yes' : 'No',
      registration_open: document.getElementById('eventEnableRegistration').checked ? document.getElementById('eventRegOpen').value : '',
      registration_close: document.getElementById('eventEnableRegistration').checked ? document.getElementById('eventRegClose').value : '',
      maximum_seats: document.getElementById('eventEnableRegistration').checked ? document.getElementById('eventRegMaxSeats').value : '',
      allow_spot_registration: (document.getElementById('eventAllowSpotRegStep1')?.checked || document.getElementById('eventAllowSpotReg')?.checked) ? 'Yes' : 'No',
      registration_fields: document.getElementById('eventEnableRegistration').checked ? this.getCustomFieldsData() : '[]',
      terms_and_conditions: document.getElementById('eventEnableRegistration').checked ? document.getElementById('eventRegTerms').value.trim() : '',

      created_by: App.State && App.State.currentUser ? App.State.currentUser.user_id : 'Unknown',
      action_by: App.State && App.State.currentUser ? App.State.currentUser.user_id : 'Unknown',
      stop_reason: document.getElementById('stopReason') ? document.getElementById('stopReason').value : '',
      resume_reason: document.getElementById('resumeReason') ? document.getElementById('resumeReason').value : '',
      cancel_reason: document.getElementById('cancelReason') ? document.getElementById('cancelReason').value : ''
    };
    
    const saveEventFunc = (finalEventData) => {
      if (isEdit) {
        App.Logger.info("FRONTEND: Update Submitted");
        App.API.updateEvent(originalId, finalEventData)
          .then(res => {
            App.Logger.info("FRONTEND: Update Success");
            this.setModalLoading(false);
            this.isFormDirty = false;
            this.editingEventId = null;
            
            const modalEl = document.getElementById('eventModal');
            if (modalEl) {
              const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
              modal.hide();
            }
            
            if (App.Modules.dashboard) {
              App.Modules.dashboard.load(true);
            }
            
            App.UI.showSuccess("Event updated successfully!");
            
            // Inline array update for snappy UI
            const updatedIndex = this.eventsData.findIndex(e => String(e.event_id) === String(originalId));
            if (updatedIndex > -1) {
              if (res.data && res.data.event) {
                this.eventsData[updatedIndex] = { ...this.eventsData[updatedIndex], ...res.data.event };
              } else {
                this.eventsData[updatedIndex] = { ...this.eventsData[updatedIndex], ...finalEventData };
              }
            }
            this.applyFilters();
          })
          .catch(err => {
            App.Logger.info("FRONTEND: Update Failed");
            this.setModalLoading(false);
            if (errorAlert) {
              errorAlert.textContent = err.message || "Failed to update event.";
              errorAlert.classList.remove('d-none');
            }
            App.UI.showError(err.message || "Failed to update event.");
          });
      } else {
        App.API.createEvent(finalEventData)
          .then(res => {
            this.setModalLoading(false);
            const modalEl = document.getElementById('eventModal');
            if (modalEl) {
              const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
              modal.hide();
            }
            
            if (App.Modules.dashboard) {
              App.Modules.dashboard.load(true);
            }
            
            App.UI.showSuccess("Event created successfully!");
            this.load();
          })
          .catch(err => {
            this.setModalLoading(false);
            if (errorAlert) {
              errorAlert.textContent = err.message || "Failed to create event.";
              errorAlert.classList.remove('d-none');
            }
            App.UI.showError(err.message || "Failed to create event.");
          });
      }
    };

    // If new coordinator is selected, register them first!
    if (!isEdit && document.getElementById('eventCoordinator').value === 'NEW_COORDINATOR') {
      const emailVal = document.getElementById('newCoordEmail').value.trim();
      const usernameVal = (emailVal.split('@')[0] || '').replace(/[^a-zA-Z0-9_\-]/g, '_');
      const currentUserRole = String(localStorage.getItem('userRole') || '').trim().toUpperCase();
      const inlineRole = (currentUserRole === 'ADMIN') ? 'Coordinator' : 'Admin';
      const newCoordPayload = {
        first_name: document.getElementById('newCoordFirstName').value.trim().toUpperCase(),
        last_name: document.getElementById('newCoordLastName').value.trim().toUpperCase(),
        email: emailVal,
        employee_id: document.getElementById('newCoordEmployeeId').value.trim().toUpperCase(),
        username: usernameVal.toLowerCase(),
        role: inlineRole,
        status: 'Active'
      };

      App.API.createUser(newCoordPayload)
        .then(res => {
          const userObj = (res && res.user) ? res.user : (res && res.data && res.data.user ? res.data.user : res);
          if (userObj && (userObj.user_id || userObj['User ID'] || userObj.userId)) {
            const newCoordId = userObj.user_id || userObj['User ID'] || userObj.userId;
            eventData.coordinator_id = newCoordId;
            saveEventFunc(eventData);
          } else {
            this.setModalLoading(false);
            const msg = (res && res.message) ? res.message : "Failed to create inline coordinator account.";
            if (errorAlert) {
              errorAlert.textContent = msg;
              errorAlert.classList.remove('d-none');
            }
            App.UI.showError(msg);
          }
        })
        .catch(err => {
          this.setModalLoading(false);
          if (errorAlert) {
            errorAlert.textContent = err.message || "Failed to create coordinator account.";
            errorAlert.classList.remove('d-none');
          }
          App.UI.showError(err.message || "Failed to create coordinator account.");
        });
    } else {
      saveEventFunc(eventData);
    }
  },

  handleDeleteEvent: function() {
    const id = document.getElementById('deleteEventId').value;
    if (!id) return;
    
    const btn = document.getElementById('eventConfirmDeleteBtn');
    const spinner = document.getElementById('eventDeleteSpinner');
    if (btn) btn.disabled = true;
    if (spinner) spinner.classList.remove('d-none');
    
    App.API.deleteEvent(id)
      .then(() => {
        if (btn) btn.disabled = false;
        if (spinner) spinner.classList.add('d-none');
        
        const modalEl = document.getElementById('eventDeleteModal');
        if (modalEl) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
        
        // TC-22: Optimistic UI — remove immediately from local data before async reload
        this.eventsData = this.eventsData.filter(e => String(e.event_id) !== String(id));
        this.applyFilters();
        
        if (App.Modules.dashboard) {
           App.Modules.dashboard.load(true);
        }
        
        App.UI.showSuccess("Event deleted successfully!");
        // Reload in background to sync with server
        this.load();
      })
      .catch(err => {
        if (btn) btn.disabled = false;
        if (spinner) spinner.classList.add('d-none');
        App.UI.showError(err.message || "Failed to delete event.");
      });
  },

  refresh: function() {
    this.loadDependencies().then(() => this.load());
  },
  
  destroy: function() {
    App.Logger.info('Events destroy');
  },
  
  setupCustomDropdowns: function() {
    const attachDropdownEvents = (prefix, defaultText) => {
      const search = document.getElementById(`${prefix}Search`);
      const selectAll = document.getElementById(`${prefix}SelectAll`);
      const clearAll = document.getElementById(`${prefix}ClearAll`);
      const spanText = document.getElementById(`${prefix}DropdownText`);
      
      const updateText = () => {
        const checked = document.querySelectorAll(`.event-${prefix.replace('event','').toLowerCase().replace('years','year').replace('departments','dept')}-check:checked`);
        spanText.textContent = checked.length > 0 ? `Selected (${checked.length})` : defaultText;
        // Update hidden inputs for validation
        const hiddenInput = document.getElementById(prefix);
        if (hiddenInput) {
          hiddenInput.value = Array.from(checked).map(c => c.value).join(',');
        }
      };

      if (search) {
        search.addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase();
          document.querySelectorAll(`.event-${prefix.replace('event','').toLowerCase().replace('years','year').replace('departments','dept')}-item`).forEach(div => {
            const label = div.querySelector('label').textContent.toLowerCase();
            div.style.display = label.includes(term) ? 'block' : 'none';
          });
        });
      }

      if (selectAll) {
        selectAll.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll(`.event-${prefix.replace('event','').toLowerCase().replace('years','year').replace('departments','dept')}-check`).forEach(cb => {
            if (cb.closest('.form-check').style.display !== 'none') cb.checked = true;
          });
          updateText();
        });
      }

      if (clearAll) {
        clearAll.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll(`.event-${prefix.replace('event','').toLowerCase().replace('years','year').replace('departments','dept')}-check`).forEach(cb => cb.checked = false);
          updateText();
        });
      }

      document.body.addEventListener('change', (e) => {
        if (e.target.classList.contains(`event-${prefix.replace('event','').toLowerCase().replace('years','year').replace('departments','dept')}-check`)) {
          updateText();
        }
      });
    };

    attachDropdownEvents('eventDepartments', 'Select Departments');
    attachDropdownEvents('eventYears', 'Select Years');
  },

  evaluateLifecycleActions: function(status) {
    const actionBtns = document.getElementById('lifecycleActionButtons');
    const btnPublish = document.getElementById('btnLifecyclePublish');
    const btnStop = document.getElementById('btnLifecycleStop');
    const btnCancel = document.getElementById('btnLifecycleCancel');
    
    const previewContainer = document.getElementById('lifecyclePreviewContainer');
    const previewText = document.getElementById('lifecyclePreviewText');
    const stopGroup = document.getElementById('stopReasonGroup');
    const resumeGroup = document.getElementById('resumeReasonGroup');
    const cancelGroup = document.getElementById('cancelReasonGroup');
    
    if (actionBtns) actionBtns.classList.remove('d-none');
    if (btnPublish) btnPublish.classList.add('d-none');
    if (btnStop) btnStop.classList.add('d-none');
    if (btnCancel) btnCancel.classList.add('d-none');
    
    if (previewContainer) previewContainer.classList.add('d-none');
    if (stopGroup) stopGroup.classList.add('d-none');
    if (resumeGroup) resumeGroup.classList.add('d-none');
    if (cancelGroup) cancelGroup.classList.add('d-none');
    
    // Clear required attributes
    if (document.getElementById('stopReason')) document.getElementById('stopReason').required = false;
    if (document.getElementById('cancelReason')) document.getElementById('cancelReason').required = false;
    
    // We store the "pending Action" in a data attribute on the save button to know what we are submitting
    if (saveBtn) saveBtn.removeAttribute('data-pending-action');
    
    if (status === 'draft') {
      if (btnPublish) btnPublish.classList.remove('d-none');
    } else if (status === 'upcoming') {
      if (btnCancel) btnCancel.classList.remove('d-none');
    } else if (status === 'active') {
      if (btnStop) btnStop.classList.remove('d-none');
    } else if (status === 'stopped') {
      if (btnCancel) btnCancel.classList.remove('d-none');
    }
  },

  handleLifecycleClick: function(action) {
    const previewContainer = document.getElementById('lifecyclePreviewContainer');
    const previewText = document.getElementById('lifecyclePreviewText');
    const stopGroup = document.getElementById('stopReasonGroup');
    const cancelGroup = document.getElementById('cancelReasonGroup');
    const saveBtn = document.getElementById('eventSaveBtn');
    
    // Reset
    if (previewContainer) previewContainer.classList.remove('d-none');
    if (stopGroup) stopGroup.classList.add('d-none');
    if (cancelGroup) cancelGroup.classList.add('d-none');
    if (document.getElementById('stopReason')) document.getElementById('stopReason').required = false;
    if (document.getElementById('cancelReason')) document.getElementById('cancelReason').required = false;
    
    if (saveBtn) {
      saveBtn.setAttribute('data-pending-action', action);
      document.getElementById('eventSaveBtnText').textContent = 'Confirm ' + action;
    }
    
    if (action === 'Publish') {
      previewText.innerHTML = `<strong>Action:</strong> This event will be published.<br><span class="text-muted small">Status will change to Upcoming.</span>`;
    } else if (action === 'Cancel') {
      previewText.innerHTML = `<strong>Action:</strong> This event will be cancelled.<br><span class="text-muted small">Cancel Reason is required.</span>`;
      if (cancelGroup) cancelGroup.classList.remove('d-none');
      if (document.getElementById('cancelReason')) document.getElementById('cancelReason').required = true;
    } else if (action === 'Stop') {
      previewText.innerHTML = `<strong>Action:</strong> This event will be stopped.<br><span class="text-muted small">Stop Reason is required.</span>`;
      if (stopGroup) stopGroup.classList.remove('d-none');
      if (document.getElementById('stopReason')) document.getElementById('stopReason').required = true;
    }
  },

  openManageParticipantsModal: function(eventId) {
    const event = this.eventsData.find(e => String(e.event_id) === String(eventId));
    if (!event) return;
    
    document.getElementById('mpEventId').value = eventId;
    document.getElementById('mpEventName').textContent = event.event_name;
    document.getElementById('mpEligibilityMessage').textContent = '';
    document.getElementById('mpSearchRoll').value = '';
    
    // Bind Add button
    const addBtn = document.getElementById('mpAddBtn');
    addBtn.replaceWith(addBtn.cloneNode(true));
    document.getElementById('mpAddBtn').addEventListener('click', () => this.addParticipant(eventId));

    // Hide Add Participant container for Admin and Super Admin roles
    const addCont = document.getElementById('mpAddContainer');
    const summaryCol = addCont ? addCont.previousElementSibling : null;
    const currentUser = App.State && App.State.currentUser;
    if (currentUser) {
      const role = String(currentUser.role || '').toUpperCase().trim();
      const isAdminOrSuper = role === 'ADMIN' || role === 'SUPER ADMIN' || role === 'SUPER_ADMIN' || role === 'SUPERADMIN';
      if (isAdminOrSuper) {
        if (addCont) addCont.style.setProperty('display', 'none', 'important');
        if (summaryCol) {
          summaryCol.classList.remove('col-md-4');
          summaryCol.classList.add('col-md-12');
        }
      } else {
        if (addCont) addCont.style.display = '';
        if (summaryCol) {
          summaryCol.classList.remove('col-md-12');
          summaryCol.classList.add('col-md-4');
        }
      }
    }

    const modal = new bootstrap.Modal(document.getElementById('manageParticipantsModal'));
    modal.show();
    
    this.loadParticipants(eventId, event);
  },

  loadParticipants: function(eventId, eventObj) {
    document.getElementById('mpTableBody').innerHTML = '<tr><td colspan="7" class="text-center py-3">Loading participants...</td></tr>';
    
    App.API._call('getEventParticipants', eventId).then(res => {
      const parts = res || [];
      const isFixed = (eventObj.attendance_type || 'Fixed') === 'Fixed';
      const activeCount = parts.filter(p => p.status === 'Active').length;
      
      const counterEl = document.getElementById('mpParticipantCounter');
      if (isFixed) {
        if (eventObj.capacity) {
          counterEl.textContent = `${activeCount} / ${eventObj.capacity}`;
        } else {
          counterEl.textContent = `${activeCount} Participants`;
        }
      } else {
        counterEl.textContent = 'Unlimited Participants';
      }

      const tbody = document.getElementById('mpTableBody');
      if (parts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">No participants found</td></tr>';
        return;
      }
      
      let html = '';
      parts.forEach(p => {
        const badge = p.status === 'Active' ? 'bg-success' : 'bg-danger';
        const actionBtn = p.status === 'Active' 
          ? `<button class="btn btn-sm btn-outline-danger" onclick="App.Modules.events.removeParticipant('${eventId}', '${p.roll_number}')">Remove</button>`
          : `<button class="btn btn-sm btn-outline-success" onclick="App.Modules.events.addParticipant('${eventId}', '${p.roll_number}')">Restore</button>`;
          
        html += `
          <tr>
            <td class="fw-bold">${App.Utils.escapeHtml(p.roll_number)}</td>
            <td>${App.Utils.escapeHtml(p.student_name)}</td>
            <td>${App.Utils.escapeHtml(p.department)}</td>
            <td>${App.Utils.escapeHtml(p.year)}</td>
            <td>${App.Utils.escapeHtml(p.section)}</td>
            <td><span class="badge ${badge}">${App.Utils.escapeHtml(p.status)}</span></td>
            <td class="text-end">${actionBtn}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }).catch(err => {
      document.getElementById('mpTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">Error loading participants</td></tr>';
      App.ErrorHandler.handle(err);
    });
  },

  addParticipant: function(eventId, rollNumberOpt) {
    const roll = rollNumberOpt || document.getElementById('mpSearchRoll').value.trim();
    if (!roll) {
      document.getElementById('mpEligibilityMessage').textContent = 'Please enter a Roll Number.';
      document.getElementById('mpEligibilityMessage').className = 'small mt-1 fw-bold text-danger';
      return;
    }
    
    document.getElementById('mpEligibilityMessage').textContent = 'Validating...';
    document.getElementById('mpEligibilityMessage').className = 'small mt-1 fw-bold text-info';
    
    App.API._call('addParticipant', eventId, roll).then(res => {
      document.getElementById('mpEligibilityMessage').textContent = res.message || 'Added successfully';
      document.getElementById('mpEligibilityMessage').className = 'small mt-1 fw-bold text-success';
      const event = this.eventsData.find(e => String(e.event_id) === String(eventId));
      this.loadParticipants(eventId, event);
    }).catch(err => {
      document.getElementById('mpEligibilityMessage').textContent = err.message || 'Error adding participant';
      document.getElementById('mpEligibilityMessage').className = 'small mt-1 fw-bold text-danger';
    });
  },

  removeParticipant: function(eventId, roll) {
    App.API._call('removeParticipant', eventId, roll).then(res => {
      App.UI.showSuccess('Participant removed');
      const event = this.eventsData.find(e => String(e.event_id) === String(eventId));
      this.loadParticipants(eventId, event);
    }).catch(err => {
      App.ErrorHandler.handle(err);
    });
  },

  handleQuickStatusUpdate: function(eventId, newStatus) {
    const event = this.eventsData.find(e => String(e.event_id) === String(eventId));
    if (!event) return;

    if (!confirm(`Are you sure you want to mark event "${event.event_name}" as ${newStatus}?`)) return;

    event.status = newStatus;
    App.LoadingManager.show();
    App.API.updateEvent(event)
      .then(() => {
        App.LoadingManager.hide();
        App.UI.showSuccess(`Event marked as ${newStatus}.`);
        this.applyFilters();
      })
      .catch(err => {
        App.LoadingManager.hide();
        App.UI.showError(`Failed to update status: ${err.message}`);
      });
  },

  handleDurationAdjustment: function(eventId, hoursDelta) {
    const event = this.eventsData.find(e => String(e.event_id) === String(eventId));
    if (!event) return;

    let endD = new Date(event.end_date + 'T' + (event.end_time !== 'N/A' ? event.end_time : '23:59:00'));
    if (isNaN(endD.getTime())) endD = new Date();

    endD.setHours(endD.getHours() + hoursDelta);

    event.end_date = endD.toISOString().split('T')[0];
    event.end_time = endD.toTimeString().split(' ')[0];

    App.LoadingManager.show();
    App.API.updateEvent(event)
      .then(() => {
        App.LoadingManager.hide();
        App.UI.showSuccess(`Duration adjusted by ${hoursDelta > 0 ? '+' : ''}${hoursDelta} hour(s).`);
        this.applyFilters();
      })
      .catch(err => {
        App.LoadingManager.hide();
        App.UI.showError(`Failed to adjust duration: ${err.message}`);
      });
  }
};

// Auto-initialize module on direct injection trigger (guard against double-init from SPA double-load)
if (typeof App !== 'undefined' && App.Modules && App.Modules.events && !App.Modules.events._initialized) {
  App.Modules.events._initialized = true;
  App.Modules.events.init();
}
</script>
