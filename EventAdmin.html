<!-- Event Admin Module Main View Component (Phase 5) -->
<div class="container-fluid py-4" id="event-admin-module-container">
  <!-- Event Header & Banner -->
  <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-primary text-white">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <span class="badge bg-white text-primary mb-2 fw-bold" id="eaEventStatus">Active</span>
        <h2 class="fw-bold mb-1" id="eaEventName">Loading Event Details...</h2>
        <p class="mb-0 text-white-50 small">
          <i class="bi bi-geo-alt-fill me-1"></i><span id="eaEventVenue">Venue</span> | 
          <i class="bi bi-clock-fill me-1"></i><span id="eaEventTime">Time</span>
        </p>
      </div>
      <div class="mt-3 mt-md-0">
        <button type="button" class="btn btn-light fw-bold text-primary px-3 me-2" id="btnEaAssignCoord">
          <i class="bi bi-person-plus-fill me-1"></i>+ Assign Coordinator
        </button>
      </div>
    </div>
  </div>

  <!-- Metric Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <div class="d-flex align-items-center">
          <div class="rounded-circle p-3 bg-success bg-opacity-10 text-success me-3">
            <i class="bi bi-person-check-fill fs-3"></i>
          </div>
          <div>
            <span class="text-muted small fw-semibold text-uppercase">Present</span>
            <h3 class="fw-bold text-dark mb-0" id="eaCardPresent">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <div class="d-flex align-items-center">
          <div class="rounded-circle p-3 bg-danger bg-opacity-10 text-danger me-3">
            <i class="bi bi-person-dash-fill fs-3"></i>
          </div>
          <div>
            <span class="text-muted small fw-semibold text-uppercase">Absent</span>
            <h3 class="fw-bold text-dark mb-0" id="eaCardAbsent">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <div class="d-flex align-items-center">
          <div class="rounded-circle p-3 bg-primary bg-opacity-10 text-primary me-3">
            <i class="bi bi-people-fill fs-3"></i>
          </div>
          <div>
            <span class="text-muted small fw-semibold text-uppercase">Registered</span>
            <h3 class="fw-bold text-dark mb-0" id="eaCardRegistered">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <div class="d-flex align-items-center">
          <div class="rounded-circle p-3 bg-info bg-opacity-10 text-info me-3">
            <i class="bi bi-pie-chart-fill fs-3"></i>
          </div>
          <div>
            <span class="text-muted small fw-semibold text-uppercase">Attendance %</span>
            <h3 class="fw-bold text-dark mb-0" id="eaCardPercentage">0%</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Secondary Metrics: Spot Registrations, Coordinators & Pending -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <span class="text-muted small fw-semibold text-uppercase">Spot Registrations</span>
        <h4 class="fw-bold text-dark mb-0 mt-1" id="eaCardSpot">0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <span class="text-muted small fw-semibold text-uppercase">Assigned Coordinators</span>
        <h4 class="fw-bold text-dark mb-0 mt-1" id="eaCardCoordinators">0</h4>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <span class="text-muted small fw-semibold text-uppercase">Pending Registrations</span>
        <h4 class="fw-bold text-dark mb-0 mt-1" id="eaCardPending">0</h4>
      </div>
    </div>
  </div>

  <!-- Coordinator Roster Table -->
  <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
    <h5 class="fw-bold text-dark mb-3">
      <i class="bi bi-person-badge-fill text-primary me-2"></i>Event Coordinators Roster
    </h5>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0" id="eaCoordTable">
        <thead class="table-light">
          <tr>
            <th class="small fw-bold text-uppercase">User ID</th>
            <th class="small fw-bold text-uppercase">Role</th>
            <th class="small fw-bold text-uppercase">Coordinator Type</th>
            <th class="small fw-bold text-uppercase">Status</th>
            <th class="small fw-bold text-uppercase">Assigned At</th>
            <th class="small fw-bold text-uppercase text-end">Action</th>
          </tr>
        </thead>
        <tbody id="eaCoordTableBody">
          <tr>
            <td colspan="6" class="text-center text-muted py-4">Loading coordinators roster...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
